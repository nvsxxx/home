<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>INVIS X | Ranked</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* --- MCTIERS DARK THEME --- */
      --bg-body: #0d1117;       /* Deep Navy/Black */
      --bg-sidebar: #010409;    
      --bg-card: #161b22;       /* Card Background */
      --bg-card-hover: #1f2428;
      
      --border-main: #30363d;
      
      /* TIER COLORS */
      --t1: #ef4444; /* Red */
      --t2: #f97316; /* Orange */
      --t3: #eab308; /* Yellow */
      --t4: #22c55e; /* Green */
      --t5: #3b82f6; /* Blue */
      
      --text-main: #c9d1d9;
      --text-head: #ffffff;
      --text-sub: #8b949e;
      
      --font-display: 'Poppins', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; transition: 0.2s; }
    button { font-family: inherit; cursor: pointer; }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-body); }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    /* Layout */
    .app-layout { display: flex; min-height: 100vh; }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 250px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-main);
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; flex-shrink: 0; z-index: 50;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-main);
      background: #0d1117;
      text-align: center;
    }
    
    .brand {
      font-family: var(--font-display);
      font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: -1px;
    }

    .nav-scroll { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; }

    .nav-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 6px;
      color: var(--text-sub); font-weight: 600; font-size: 0.85rem;
      transition: all 0.2s; background: transparent; border: 1px solid transparent; width: 100%;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.04); color: #fff; }
    .nav-btn[aria-pressed="true"] {
      background: #1f2428; color: #fff; border-left: 3px solid #58a6ff;
    }
    .nav-btn img { width: 18px; height: 18px; object-fit: contain; opacity: 0.7; }
    .nav-btn[aria-pressed="true"] img { opacity: 1; }
    
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border-main); font-size: 0.7rem; color: #444; text-align: center; }

    /* --- MAIN --- */
    .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-body); }

    .topbar {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; border-bottom: 1px solid var(--border-main);
      background: var(--bg-card); position: sticky; top: 0; z-index: 40;
    }

    .page-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: var(--text-head); text-transform: uppercase; }

    .topbar-actions { display: flex; gap: 12px; align-items: center; }

    .search-wrapper { position: relative; width: 240px; }
    .search-input {
      width: 100%; background: #0d1117; border: 1px solid var(--border-main); color: #fff;
      padding: 8px 12px 8px 36px; border-radius: 6px; font-size: 0.85rem; outline: none; transition: 0.2s;
    }
    .search-input:focus { border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #666; pointer-events: none; }

    .content-area { padding: 24px 32px; flex: 1; }

    /* --- OVERALL LIST --- */
    .overall-grid { display: flex; flex-direction: column; gap: 8px; }

    .player-card-row {
      display: flex; align-items: center;
      background: var(--bg-card); 
      border: 1px solid var(--border-main); 
      border-radius: 6px;
      overflow: hidden; /* Important for the rank slant */
      height: 84px; /* Fixed height for consistency */
      position: relative;
      transition: transform 0.15s ease, background 0.15s;
      cursor: pointer;
    }
    .player-card-row:hover {
      background: var(--bg-card-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    /* Rank Slant Container */
    .rank-slant {
      height: 100%; width: 85px; flex-shrink: 0;
      clip-path: polygon(0 0, 100% 0, 75% 100%, 0% 100%);
      display: flex; align-items: center; justify-content: flex-start;
      padding-left: 20px;
      background: #21262d; /* Default gray */
    }
    
    .rank-num {
      font-family: var(--font-display); font-weight: 800; font-style: italic;
      font-size: 1.8rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* Rank Colors */
    .rank-slant.rank-1 { background: linear-gradient(135deg, #facc15, #b45309); }
    .rank-slant.rank-2 { background: linear-gradient(135deg, #cbd5e1, #475569); }
    .rank-slant.rank-3 { background: linear-gradient(135deg, #fdba74, #c2410c); }

    /* Player Info Section */
    .player-info-container {
      display: flex; align-items: center; gap: 16px; 
      padding-left: 10px; flex: 1; min-width: 0;
    }

    .player-head { 
      width: 48px; height: 48px; border-radius: 6px; 
      background: #0d1117; object-fit: cover; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .text-stack { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .player-name { font-weight: 800; font-size: 1.15rem; color: #fff; line-height: 1.1; }
    
    .player-subline { 
      display: flex; align-items: center; gap: 6px; 
      font-size: 0.8rem; color: #8b949e; font-weight: 500;
    }
    
    .diamond-icon { width: 14px; height: 14px; fill: #fbbf24; } /* The gold diamond */

    /* Right Side Stats */
    .right-section {
      display: flex; align-items: center; gap: 20px;
      padding-right: 20px; height: 100%;
    }

    /* Region Badge */
    .region-box {
      font-family: var(--font-display); font-weight: 800; font-size: 0.9rem;
      padding: 6px 10px; border-radius: 6px; color: #fff;
      background: #333; text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .region-box.na { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
    .region-box.eu { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.4); }
    .region-box.as { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.4); }

    /* Row Breakdown Icons */
    .row-tiers { display: flex; gap: 6px; align-items: center; }
    
    /* Reuse the modal logic but smaller */
    .rt-item { display: flex; flex-direction: column; align-items: center; width: 32px; }
    .rt-icon {
      width: 28px; height: 28px; border-radius: 50%; background: #0d1117;
      border: 1px solid #30363d; display: grid; place-items: center;
      margin-bottom: -8px; z-index: 2;
    }
    .rt-icon img { width: 14px; height: 14px; object-fit: contain; }
    .rt-badge {
      font-size: 0.5rem; font-weight: 800; padding: 2px 0; width: 100%; text-align: center;
      border-radius: 10px; background: #21262d; border: 1px solid #30363d; color: #8b949e;
      padding-top: 8px; z-index: 1;
    }

    /* Colors for Row Icons */
    .rt-icon[data-tier*="1"] { border-color: var(--t1); box-shadow: 0 0 5px rgba(239,68,68,0.3); }
    .rt-icon[data-tier*="2"] { border-color: var(--t2); box-shadow: 0 0 5px rgba(249,115,22,0.3); }
    .rt-icon[data-tier*="3"] { border-color: var(--t3); box-shadow: 0 0 5px rgba(234,179,8,0.3); }
    .rt-icon[data-tier*="4"] { border-color: var(--t4); }
    .rt-icon[data-tier*="5"] { border-color: var(--t5); }
    
    .rt-badge[data-tier*="1"] { color: var(--t1); background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); }
    .rt-badge[data-tier*="2"] { color: var(--t2); background: rgba(249,115,22,0.1); border-color: rgba(249,115,22,0.3); }
    .rt-badge[data-tier*="3"] { color: var(--t3); background: rgba(234,179,8,0.1); border-color: rgba(234,179,8,0.3); }
    .rt-badge[data-tier*="4"] { color: var(--t4); background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); }
    .rt-badge[data-tier*="5"] { color: var(--t5); background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3); }

    /* --- TIER BOARD (COLUMNS) --- */
    .tier-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: start; }
    .tier-col { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .tier-header { padding: 12px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 1rem; color: #fff; }
    .tier-col:nth-child(1) .tier-header { background: var(--t1); }
    .tier-col:nth-child(2) .tier-header { background: var(--t2); }
    .tier-col:nth-child(3) .tier-header { background: var(--t3); }
    .tier-col:nth-child(4) .tier-header { background: var(--t4); }
    .tier-col:nth-child(5) .tier-header { background: var(--t5); }
    .tier-list { padding: 4px; max-height: 75vh; overflow-y: auto; }
    .tier-player { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 4px; cursor: pointer; transition: 0.1s; border-bottom: 1px solid rgba(255,255,255,0.02); }
    .tier-player:hover { background: #21262d; }
    .tp-head { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }
    .tp-name { font-size: 0.85rem; font-weight: 600; flex: 1; color: #c9d1d9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tp-badge { font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: #0d1117; border: 1px solid #30363d; color: #8b949e; }
    
    /* --- MODAL --- */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.2s; }
    .modal-backdrop.show { display: flex; opacity: 1; }
    .modal { background: #161b22; border-radius: 12px; width: 100%; max-width: 460px; border: 1px solid #30363d; box-shadow: 0 25px 50px rgba(0,0,0,0.7); padding: 24px; position: relative; transform: translateY(10px); transition: 0.3s; }
    .modal-backdrop.show .modal { transform: translateY(0); }
    .m-close-absolute { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: #8b949e; font-size: 1.5rem; cursor: pointer; transition: 0.2s; z-index: 10; }
    .m-close-absolute:hover { color: #fff; }

    /* Modal Internals */
    .pfp-container { display: flex; justify-content: center; margin-bottom: 16px; }
    .pfp-img { width: 80px; height: 80px; border-radius: 12px; border: 3px solid #30363d; background: #0d1117; object-fit: cover; }
    .profile-name { text-align: center; font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 2px; }
    
    /* Position Bar in Modal */
    .position-bar { display: flex; height: 50px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; align-items: center; margin: 20px 0; }
    .pos-rank-stub { height: 100%; width: 70px; background: #21262d; clip-path: polygon(0 0, 100% 0, 80% 100%, 0% 100%); display: flex; align-items: center; justify-content: center; padding-right: 10px; }
    .pos-rank-stub.rank-1 { background: linear-gradient(135deg, #facc15, #b45309); }
    .pos-rank-stub.rank-2 { background: linear-gradient(135deg, #cbd5e1, #475569); }
    .pos-rank-stub.rank-3 { background: linear-gradient(135deg, #fdba74, #c2410c); }
    .pos-rank-text { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; font-style: italic; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .pos-info { flex: 1; display: flex; align-items: center; padding-left: 12px; gap: 8px; color: #fff; }
    .pos-points { color: #8b949e; font-size: 0.9rem; font-weight: 600; font-family: var(--font-body); }

    /* Modal Tiers Grid */
    .tiers-box { background: #0d1117; border: 1px solid #30363d; border-radius: 12px; padding: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
    .bd-item { display: flex; flex-direction: column; align-items: center; width: 50px; }
    .bd-icon { width: 44px; height: 44px; border-radius: 50%; background: #010409; border: 2px solid #30363d; display: grid; place-items: center; margin-bottom: -12px; z-index: 10; }
    .bd-icon img { width: 22px; height: 22px; object-fit: contain; }
    .bd-badge { font-family: var(--font-display); font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 50px; width: 100%; text-align: center; background: #161b22; border: 1px solid #30363d; color: #8b949e; padding-top: 12px; min-width: 48px; }
    
    /* Responsive */
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border-main); }
      .nav-scroll { flex-direction: row; overflow-x: auto; align-items: center; }
      .nav-btn { white-space: nowrap; width: auto; font-size: 0.8rem; padding: 8px 12px; }
      .sidebar-footer { display: none; }
      .topbar { padding: 0 16px; height: 56px; }
      .player-card-row { height: auto; flex-wrap: wrap; padding: 12px; }
      .rank-slant { width: 60px; font-size: 0.8rem; }
      .right-section { width: 100%; justify-content: space-between; padding-right: 0; margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; }
      .tier-board { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) { .tier-board { grid-template-columns: 1fr; } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">INVIS X</div>
      </div>
      
      <nav class="nav-scroll" id="filterTabs">
        <button class="nav-btn" data-filter="overall" aria-pressed="true">
          <img src="overall.png" alt="" onerror="this.style.display='none'"> Overall
        </button>
        <button class="nav-btn" data-filter="sword" aria-pressed="false">
          <img src="sword.png" alt="" onerror="this.style.display='none'"> Sword
        </button>
        <button class="nav-btn" data-filter="axe" aria-pressed="false">
          <img src="axe.png" alt="" onerror="this.style.display='none'"> Axe
        </button>
        <button class="nav-btn" data-filter="crystal" aria-pressed="false">
          <img src="crystal.png" alt="" onerror="this.style.display='none'"> Crystal
        </button>
        <button class="nav-btn" data-filter="nethpot" aria-pressed="false">
          <img src="nethpot.png" alt="" onerror="this.style.display='none'"> Nethpot
        </button>
        <button class="nav-btn" data-filter="uhc" aria-pressed="false">
          <img src="uhc.png" alt="" onerror="this.style.display='none'"> UHC
        </button>
        <button class="nav-btn" data-filter="smp" aria-pressed="false">
          <img src="smp.png" alt="" onerror="this.style.display='none'"> SMP
        </button>
        <button class="nav-btn" data-filter="mace" aria-pressed="false">
          <img src="mace.png" alt="" onerror="this.style.display='none'"> Mace
        </button>
      </nav>

      <div class="sidebar-footer">
        &copy; 2025 INVIS X
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="topbar">
        <div class="page-title" id="pageTitle">Overall</div>
        <div class="topbar-actions">
          <div class="search-wrapper">
            <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search..." spellcheck="false">
          </div>
          <button id="infoBtn" class="btn-info">Info</button>
        </div>
      </header>

      <div class="content-area">
        <div id="overallView" class="overall-grid"></div>
        <div id="tierView" class="tier-board hidden"></div>
      </div>
    </main>
  </div>

  <!-- PLAYER MODAL -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div id="modalContainer" class="modal">
      <button id="mClose" class="m-close-absolute">&times;</button>
      
      <div class="pfp-container">
        <img id="mHead" src="" class="pfp-img" alt="">
      </div>

      <div id="mName" class="profile-name">Player</div>

      <!-- POSITION SECTION -->
      <div class="position-bar">
        <!-- Rank Stub -->
        <div id="mRankStub" class="pos-rank-stub">
          <span id="mRankText" class="pos-rank-text">1.</span>
        </div>
        <!-- Info -->
        <div class="pos-info">
          <span class="trophy-icon">🏆</span>
          <div style="display:flex; flex-direction:column;">
            <span id="mTitle" style="font-weight:800; font-family:var(--font-display); line-height:1;">TITLE</span>
            <span id="mPointsText" class="pos-points">(0 points)</span>
          </div>
        </div>
      </div>

      <!-- TIERS SECTION -->
      <div id="mBreakdown" class="tiers-box"></div>

    </div>
  </div>

  <!-- INFO MODAL -->
  <div id="infoBackdrop" class="modal-backdrop">
    <div class="modal" style="max-width: 400px;">
      <button id="infoClose" class="m-close-absolute">&times;</button>
      <div style="text-align:center; margin-bottom:24px;">
         <h2 style="font-family:var(--font-display); font-weight:800; font-size:1.4rem; color:#fff;">Titles & Points</h2>
      </div>
      <div style="display:grid; gap:8px; font-size:0.9rem;">
        <div style="display:flex;justify-content:space-between;padding:12px;background:#0d1117;border-radius:8px;border:1px solid #30363d;"><span>Grandmaster</span> <span style="font-weight:700;color:var(--t1);">400+</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px;background:#0d1117;border-radius:8px;border:1px solid #30363d;"><span>Master</span> <span style="font-weight:700;color:var(--t2);">250+</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px;background:#0d1117;border-radius:8px;border:1px solid #30363d;"><span>Ace</span> <span style="font-weight:700;color:var(--t3);">100+</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px;background:#0d1117;border-radius:8px;border:1px solid #30363d;"><span>Specialist</span> <span style="font-weight:700;color:var(--t4);">50+</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px;background:#0d1117;border-radius:8px;border:1px solid #30363d;"><span>Cadet</span> <span style="font-weight:700;color:var(--t5);">20+</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px;background:#0d1117;border-radius:8px;border:1px solid #30363d;"><span>Novice</span> <span style="font-weight:700;color:#666;">10+</span></div>
      </div>
    </div>
  </div>

  <script>
    // --- Data Logic ---
    let players = [];
    const CATEGORIES = ["sword","axe","crystal","nethpot","uhc","smp","mace"];
    const CAT_ICONS = {
      sword: "sword.png", axe: "axe.png", crystal: "crystal.png",
      nethpot: "nethpot.png", uhc: "uhc.png", smp: "smp.png", mace: "mace.png"
    };
    const DEFAULT_PLAYERS = [];

    const POINTS_MAP = {
      "HT1": 60, "LT1": 30,
      "HT2": 30, "LT2": 15,
      "HT3": 15, "LT3": 14,
      "HT4": 8,  "LT4": 6,
      "HT5": 4,  "LT5": 1
    };

    const TITLES = [
      { min: 400, t: "Grandmaster" },
      { min: 250, t: "Master" },
      { min: 100, t: "Ace" },
      { min: 50,  t: "Specialist" },
      { min: 20,  t: "Cadet" },
      { min: 10,  t: "Novice" },
      { min: 0,   t: "Beginner" }
    ];

    function getImageUrl(name, type = 'bust') {
      const cleanName = name ? name.trim() : 'MHF_Steve';
      return type === 'bust' 
        ? `https://vzge.me/bust/${cleanName}` 
        : `https://vzge.me/face/${cleanName}`;
    }

    async function loadData() {
      const urls = [
        "./players.json",
        "https://raw.githubusercontent.com/nyiyuji016-rgb/invis-x/main/players.json"
      ];
      for (let url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const json = await res.json();
            let raw = Array.isArray(json) ? json : (json.players || []);
            if (!Array.isArray(raw) && typeof json === 'object') {
               raw = [];
               for(let [k,v] of Object.entries(json)) {
                 if(typeof v !== 'object') continue;
                 CATEGORIES.forEach(c => {
                   if(v[c]) raw.push({ name: k, cat: c, tier: v[c], region: v.region, tester: v.tester });
                 });
               }
            }
            if (raw.length) { players = raw; return; }
          }
        } catch(e) {}
      }
      players = DEFAULT_PLAYERS; 
    }

    function getPoints(tier) { return POINTS_MAP[tier] || 0; }
    function getTitle(pts) { return TITLES.find(x => pts >= x.min).t; }
    
    function processData() {
      const map = new Map();
      players.forEach(p => {
        if (!CATEGORIES.includes(p.cat)) return;
        if (!map.has(p.name)) {
          map.set(p.name, { name: p.name, region: p.region || '—', tester: !!p.tester, tiers: {}, points: 0 });
        }
        const entry = map.get(p.name);
        const curTier = entry.tiers[p.cat];
        if (!curTier || getPoints(p.tier) > getPoints(curTier)) {
          entry.tiers[p.cat] = p.tier;
        }
      });
      for (let p of map.values()) {
        let pts = 0;
        Object.values(p.tiers).forEach(t => pts += getPoints(t));
        p.points = pts;
        p.title = getTitle(pts);
      }
      return { list: Array.from(map.values()).sort((a,b) => b.points - a.points || a.name.localeCompare(b.name)), map };
    }

    // --- Rendering ---
    const overallView = document.getElementById("overallView");
    const tierView = document.getElementById("tierView");
    const searchInput = document.getElementById("searchInput");
    const pageTitle = document.getElementById("pageTitle");
    let currentFilter = "overall";
    let processedData = { list:[], map: new Map() };

    function render() {
      const term = searchInput.value.toLowerCase();
      pageTitle.textContent = currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1);

      if (currentFilter === "overall") {
        tierView.classList.add("hidden");
        overallView.classList.remove("hidden");
        renderOverall(term);
      } else {
        overallView.classList.add("hidden");
        tierView.classList.remove("hidden");
        renderTier(term);
      }
    }

    function renderOverall(term) {
      overallView.innerHTML = "";
      const filtered = processedData.list.filter(p => p.name.toLowerCase().includes(term));
      
      if (!filtered.length) {
        overallView.innerHTML = `<div style="text-align:center;padding:40px;color:#666;">No players found.</div>`;
        return;
      }

      filtered.forEach((p, idx) => {
        const el = document.createElement("div");
        el.className = "player-card-row";
        
        let rankClass = "rank-norm";
        if (idx === 0) rankClass = "rank-1"; 
        else if (idx === 1) rankClass = "rank-2"; 
        else if (idx === 2) rankClass = "rank-3"; 
        
        // --- Region Badge Logic ---
        let regionClass = "";
        const reg = (p.region || "").toLowerCase();
        if(reg.includes("na")) regionClass = "na";
        else if(reg.includes("eu")) regionClass = "eu";
        else if(reg.includes("as")) regionClass = "as";

        // --- Generate Mini Icon Breakdown ---
        const breakdownHtml = CATEGORIES.map(c => {
          const t = p.tiers[c] || "";
          if(!t) return ""; // Skip empty
          return `
            <div class="rt-item">
               <div class="rt-icon" data-tier="${t}">
                  <img src="${CAT_ICONS[c]}" alt="">
               </div>
               <div class="rt-badge" data-tier="${t}">${t}</div>
            </div>
          `;
        }).join('');

        el.innerHTML = `
          <!-- SLANTED RANK -->
          <div class="rank-slant ${rankClass}">
             <div class="rank-num">${idx + 1}.</div>
          </div>
          
          <!-- PLAYER INFO -->
          <div class="player-info-container">
             <img src="${getImageUrl(p.name, 'bust')}" class="player-head" loading="lazy" onerror="this.src='https://vzge.me/bust/X-Steve'">
             <div class="text-stack">
                <div class="player-name">${p.name}</div>
                <div class="player-subline">
                   <!-- Diamond Icon SVG -->
                   <svg class="diamond-icon" viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2z"/></svg>
                   <span>${p.title} (${p.points} points)</span>
                </div>
             </div>
          </div>

          <!-- RIGHT SIDE (REGION + ICONS) -->
          <div class="right-section">
             <div class="region-box ${regionClass}">${p.region}</div>
             <div class="row-tiers hidden md:flex">${breakdownHtml}</div>
          </div>
        `;
        el.onclick = () => openModal(p, idx+1);
        overallView.appendChild(el);
      });
    }

    function renderTier(term) {
      tierView.innerHTML = "";
      const cols = [1,2,3,4,5];
      const tierMap = { 1: [], 2: [], 3: [], 4: [], 5: [] };
      const rawFiltered = players.filter(p => p.cat === currentFilter && p.name.toLowerCase().includes(term));
      
      rawFiltered.forEach(p => {
        const m = p.tier.match(/(\d)$/);
        if (m) {
          const t = parseInt(m[1]);
          if (tierMap[t]) tierMap[t].push(p);
        }
      });

      Object.keys(tierMap).forEach(k => {
        tierMap[k].sort((a,b) => {
           const aH = a.tier.startsWith("HT");
           const bH = b.tier.startsWith("HT");
           if (aH && !bH) return -1;
           if (!aH && bH) return 1;
           return a.name.localeCompare(b.name);
        });
      });

      cols.forEach(num => {
        const col = document.createElement("div");
        col.className = "tier-col";
        const items = tierMap[num];
        
        let html = `<div class="tier-header">TIER ${num}</div><div class="tier-list">`;
        if (items.length === 0) {
           html += `<div style="padding:20px;text-align:center;font-size:0.8rem;color:#444;">—</div>`;
        } else {
          items.forEach(p => {
            html += `
              <div class="tier-player" onclick="findAndOpen('${p.name}')">
                <img src="${getImageUrl(p.name, 'face')}" class="tp-head" loading="lazy" onerror="this.src='https://vzge.me/face/X-Steve'">
                <div class="tp-name">${p.name}</div>
                <div class="tp-badge" data-tier="${p.tier}">${p.tier}</div>
              </div>
            `;
          });
        }
        html += `</div>`;
        col.innerHTML = html;
        tierView.appendChild(col);
      });
    }

    // --- Modal Logic ---
    const modalBackdrop = document.getElementById("modalBackdrop");
    const mClose = document.getElementById("mClose");
    
    function openModal(data, rank) {
      const mHead = document.getElementById("mHead");
      const mRankStub = document.getElementById("mRankStub");

      // Reset
      mRankStub.className = "pos-rank-stub";

      // Apply
      if (rank === 1) mRankStub.classList.add("rank-1");
      else if (rank === 2) mRankStub.classList.add("rank-2");
      else if (rank === 3) mRankStub.classList.add("rank-3");
      else mRankStub.classList.add("rank-norm");

      mHead.src = getImageUrl(data.name, 'bust');
      mHead.onerror = function() { this.src='https://vzge.me/bust/X-Steve'; };

      document.getElementById("mName").textContent = data.name;
      document.getElementById("mTitle").textContent = data.title;
      
      document.getElementById("mRankText").textContent = rank ? `${rank}.` : '-';
      document.getElementById("mPointsText").textContent = `(${data.points} points)`;
      
      const bd = document.getElementById("mBreakdown");
      bd.innerHTML = "";
      CATEGORIES.forEach(c => {
        const t = data.tiers[c] || "";
        const div = document.createElement("div");
        div.className = "bd-item";
        div.innerHTML = `
          <div class="bd-icon" data-tier="${t}" title="${c}">
            <img src="${CAT_ICONS[c]}" alt="" onerror="this.style.display='none'">
          </div>
          <div class="bd-badge" data-tier="${t}">${t || '-'}</div>
        `;
        bd.appendChild(div);
      });
      modalBackdrop.classList.add("show");
    }

    function closeModal() { modalBackdrop.classList.remove("show"); }
    mClose.onclick = closeModal;
    modalBackdrop.onclick = (e) => { if(e.target === modalBackdrop) closeModal(); }

    function findAndOpen(name) {
      const p = processedData.map.get(name);
      if (p) {
        const idx = processedData.list.indexOf(p);
        openModal(p, idx + 1);
      }
    }

    const infoBtn = document.getElementById("infoBtn");
    const infoBackdrop = document.getElementById("infoBackdrop");
    const infoClose = document.getElementById("infoClose");
    infoBtn.onclick = () => infoBackdrop.classList.add("show");
    infoClose.onclick = () => infoBackdrop.classList.remove("show");
    infoBackdrop.onclick = (e) => { if(e.target===infoBackdrop) infoBackdrop.classList.remove("show"); }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        currentFilter = btn.dataset.filter;
        render();
        if (window.innerWidth < 768) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    });
    
    searchInput.oninput = render;

    (async () => {
      await loadData();
      processedData = processData();
      render();
    })();
  </script>
</body>
</html>
