<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <!-- FontAwesome for the Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* Basic Page Reset */
        body {
            background-color: #1e1220; /* Dark background for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        /* The Main Container */
        .profile-card {
            background-color: #2b1b2d; /* The purple background from image */
            padding: 15px 20px;
            border-radius: 8px; /* Slightly rounded corners if you want a box */
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            min-width: 350px;
        }

        /* Avatar Image */
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 10px; /* Rounded corners on image */
            object-fit: cover;
            background-color: #111; /* Fallback color */
        }

        /* Right Side Content */
        .info-container {
            display: flex;
            flex-direction: column;
            gap: 6px; /* Space between top row and bottom row */
        }

        /* Top Row: Name and Tester Badge */
        .top-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .username {
            font-size: 1.4rem;
            font-weight: 900; /* Extra bold */
            letter-spacing: -0.5px;
        }

        .badge-tester {
            background-color: rgba(168, 50, 60, 0.2); /* Semi-transparent red */
            border: 1px solid #7a3e46;
            color: #d68a96; /* Pinkish text */
            font-size: 0.65rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Bottom Row: Icon, Title, Points */
        .bottom-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* The Requested Title Icon */
        .title-icon {
            color: #9b6dff; /* Purple Icon Color */
            font-size: 0.9rem;
        }

        .role-title {
            color: #a5a5a5; /* Grey text */
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-points {
            background-color: #3e3341; /* Dark Grey pill background */
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 5px; /* Push it slightly to the right */
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Replace this URL with your Minecraft skin head render -->
        <img src="https://lh3.googleusercontent.com/proxy/uKqAqD0i4q-wO3fqO6JKF-tuvT_O5TgxC6CqF6O3W9H_u6uXQZzG7yN8L9KjM1O2pP-R4sS5T6U8VwX0YyZ3aA" alt="Skin" class="avatar">
        
        <div class="info-container">
            <!-- Top Row -->
            <div class="top-row">
                <span class="username">ChadPSL</span>
                <span class="badge-tester">TESTER</span>
            </div>

            <!-- Bottom Row -->
            <div class="bottom-row">
                <!-- THE TITLE ICON -->
                <i class="fa-solid fa-crosshairs title-icon"></i>
                
                <span class="role-title">COMBAT SPECIALIST</span>
                <span class="badge-points">58 PTS</span>
            </div>
        </div>
    </div>

</body>
</html>
