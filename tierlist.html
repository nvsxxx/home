<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INVIS X | Leaderboards</title>

  <!-- Tailwind CSS (Utility) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Fonts: Poppins (Display) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* --- THEME PALETTE --- */
      --bg-body: #0e1015;       /* Very dark background */
      --bg-header: #13151b;     /* Navbar bg */
      --bg-row: #161921;        /* Card bg */
      --bg-row-hover: #1c2029;
      
      --text-main: #ffffff;
      --text-muted: #6b7280;
      --text-blue: #5865f2;     /* Discord-ish blue */

      /* RANK COLORS */
      --rank-1: #fbbf24; /* Gold */
      --rank-2: #9ca3af; /* Silver */
      --rank-3: #b45309; /* Bronze */
      --rank-n: #252830; /* Dark Grey for 4+ */

      /* TIER COLORS (Badges) */
      --c-t1: #eab308; /* Gold/Yellow */
      --c-t2: #f97316; /* Orange */
      --c-t3: #a855f7; /* Purple (Common for T3) */
      --c-t4: #22c55e; /* Green */
      --c-t5: #3b82f6; /* Blue */

      --font-display: 'Poppins', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* --- NAVIGATION BAR --- */
    .navbar {
      background: var(--bg-header);
      border-bottom: 1px solid #1f222b;
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .nav-tabs {
      display: flex;
      height: 100%;
      gap: 10px;
    }

    .nav-tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%;
      padding: 0 20px;
      color: #6b7280;
      font-weight: 600;
      font-size: 0.85rem;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
      gap: 4px;
    }
    .nav-tab img { width: 20px; height: 20px; filter: grayscale(100%) opacity(0.5); transition: 0.2s; }
    
    .nav-tab:hover { color: #ccc; }
    .nav-tab:hover img { filter: grayscale(0) opacity(0.8); }

    .nav-tab.active {
      color: #fff;
      border-bottom-color: #fff;
    }
    .nav-tab.active img { filter: grayscale(0) opacity(1); }

    .nav-actions {
      display: flex; align-items: center; gap: 16px;
    }

    .info-btn {
      background: #1f232e; color: #fff; font-weight: 600; font-size: 0.8rem;
      padding: 8px 16px; border-radius: 6px; display: flex; align-items: center; gap: 8px;
      transition: 0.2s;
    }
    .info-btn:hover { background: #2a3040; }

    .server-ip {
      background: #000; color: #fff; padding: 8px 12px; border-radius: 6px;
      font-family: monospace; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
    }

    /* --- MAIN CONTENT --- */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
      width: 100%;
    }

    .search-bar-container {
      margin-bottom: 20px;
      display: flex; justify-content: flex-end;
    }
    .search-input {
      background: #13151b; border: 1px solid #252830; color: #fff;
      padding: 10px 16px; border-radius: 8px; width: 300px;
      font-family: var(--font-body);
    }
    .search-input:focus { border-color: #444; outline: none; }

    /* --- TABLE HEADERS --- */
    .table-header {
      display: grid;
      grid-template-columns: 80px 300px 100px 1fr; /* Matches row layout */
      padding: 0 10px 10px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #3b4050;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .th-center { text-align: center; }
    .th-right { text-align: right; }

    /* --- PLAYER ROW (CARD) --- */
    .player-row {
      display: grid;
      grid-template-columns: 80px 300px 100px 1fr;
      background: var(--bg-row);
      border-radius: 8px;
      margin-bottom: 8px;
      height: 80px;
      align-items: center;
      overflow: hidden; /* For rank shape */
      position: relative;
      transition: transform 0.2s, background 0.2s;
      cursor: pointer;
    }
    .player-row:hover {
      background: var(--bg-row-hover);
      transform: translateY(-2px);
    }

    /* 1. Rank Column (Left) */
    .rank-box {
      height: 100%;
      width: 110%; /* Slightly wider for slant */
      background: var(--rank-n);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 800;
      font-style: italic;
      color: #fff;
      clip-path: polygon(0 0, 75% 0, 100% 100%, 0% 100%);
      padding-right: 15px;
      z-index: 1;
    }
    .rank-1 .rank-box { background: var(--rank-1); color: #000; text-shadow: 0 1px 0 rgba(255,255,255,0.4); }
    .rank-2 .rank-box { background: var(--rank-2); color: #000; }
    .rank-3 .rank-box { background: var(--rank-3); color: #000; }

    /* 2. Player Info Column */
    .player-cell {
      display: flex;
      align-items: center;
      position: relative;
      padding-left: 10px;
    }
    .player-bust {
      width: 50px;
      height: 50px;
      object-fit: contain;
      margin-right: 15px;
      z-index: 2; /* Sit above rank slant */
      filter: drop-shadow(3px 3px 5px rgba(0,0,0,0.5));
    }
    .player-text {
      display: flex; flex-direction: column;
      z-index: 2;
    }
    .p-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      line-height: 1.2;
    }
    .p-sub {
      font-size: 0.75rem;
      color: #6b7280;
      display: flex; align-items: center; gap: 6px;
    }
    .diamond-icon { color: #fbbf24; font-size: 0.8rem; }

    /* 3. Region Column */
    .region-cell {
      display: flex; justify-content: center;
    }
    .region-badge {
      background: #991b1b; /* Dark Red for NA default */
      color: #fca5a5;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    /* Dynamic region colors */
    .reg-EU { background: #14532d; color: #86efac; } /* Green */
    .reg-ASIA { background: #1e3a8a; color: #93c5fd; } /* Blue */

    /* 4. Tiers Column (Grid of Icons) */
    .tiers-cell {
      display: flex;
      gap: 16px;
      justify-content: flex-end;
      padding-right: 24px;
      align-items: center;
    }

    .tier-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    
    .tg-icon {
      width: 20px; height: 20px;
      opacity: 0.5; /* Dim if not relevant, handled via JS usually, but here we show all */
    }
    .tg-icon.active { opacity: 1; }

    .tg-badge {
      font-size: 0.6rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      background: #333;
      color: #bbb;
      min-width: 32px;
      text-align: center;
    }

    /* Tier Colors applied to Badge */
    .tg-badge.t1 { background: var(--c-t1); color: #000; }
    .tg-badge.t2 { background: var(--c-t2); color: #000; }
    .tg-badge.t3 { background: var(--c-t3); color: #fff; }
    .tg-badge.t4 { background: var(--c-t4); color: #000; }
    .tg-badge.t5 { background: var(--c-t5); color: #fff; }
    .tg-badge.tn { background: #27272a; color: #555; } /* None/Empty */

    /* --- RESPONSIVE --- */
    @media (max-width: 1024px) {
      .player-row, .table-header { grid-template-columns: 60px 1fr; height: auto; padding: 10px; }
      .rank-box { clip-path: none; width: 100%; border-radius: 4px; height: 40px; margin-bottom: 10px; }
      .region-cell, .tiers-cell { display: none; } /* Hide complex cols on mobile */
      .player-row { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
      .nav-tabs { overflow-x: auto; }
      .nav-tab span { display: none; } /* Icons only on mobile nav */
    }
    
    .hidden { display: none !important; }

    /* Modal Styling (Simple Overlay) */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
      display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
    }
    .modal-backdrop.show { display: flex; }
    .modal-content {
      background: #161921; padding: 30px; border-radius: 12px;
      border: 1px solid #333; max-width: 400px; width: 90%; text-align: center;
    }
    .m-pfp { width: 80px; height: 80px; border-radius: 8px; margin-bottom: 15px; }
    .m-title { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .m-sub { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
    .m-close { margin-top: 20px; padding: 8px 20px; background: #333; color: #fff; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-tabs" id="navTabs">
      <button class="nav-tab active" data-filter="overall">
        <img src="overall.png" alt="Overall" onerror="this.src='https://cdn-icons-png.flaticon.com/512/10697/10697368.png'">
        <span>Overall</span>
      </button>
      <button class="nav-tab" data-filter="sword">
        <img src="sword.png" alt="Sword" onerror="this.src='https://cdn-icons-png.flaticon.com/512/9637/9637213.png'">
        <span>Sword</span>
      </button>
      <button class="nav-tab" data-filter="axe">
        <img src="axe.png" alt="Axe" onerror="this.src='https://cdn-icons-png.flaticon.com/512/8144/8144456.png'">
        <span>Axe</span>
      </button>
      <button class="nav-tab" data-filter="crystal">
        <img src="crystal.png" alt="Crystal" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2622/2622557.png'">
        <span>Crystal</span>
      </button>
      <button class="nav-tab" data-filter="nethpot">
        <img src="nethpot.png" alt="Pot" onerror="this.src='https://cdn-icons-png.flaticon.com/512/867/867909.png'">
        <span>Pot</span>
      </button>
      <button class="nav-tab" data-filter="uhc">
        <img src="uhc.png" alt="UHC" onerror="this.src='https://cdn-icons-png.flaticon.com/512/833/833475.png'">
        <span>UHC</span>
      </button>
      <button class="nav-tab" data-filter="smp">
        <img src="smp.png" alt="SMP" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3033/3033143.png'">
        <span>SMP</span>
      </button>
      <button class="nav-tab" data-filter="mace">
        <img src="mace.png" alt="Mace" onerror="this.src='https://cdn-icons-png.flaticon.com/512/9349/9349884.png'">
        <span>Mace</span>
      </button>
    </div>

    <div class="nav-actions">
      <button class="info-btn">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
        Information
      </button>
      <div class="server-ip">
        <span style="color:#d1d5db; font-size:0.75rem;">SERVER IP</span>
        <strong>invis.x</strong>
      </div>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="container">
    <div class="search-bar-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search player...">
    </div>

    <!-- HEADERS -->
    <div class="table-header">
      <div class="th-center">#</div>
      <div>PLAYER</div>
      <div class="th-center">REGION</div>
      <div class="th-right">TIERS</div>
    </div>

    <!-- ROWS CONTAINER -->
    <div id="rankingsList">
      <!-- Generated via JS -->
    </div>
  </div>

  <!-- BASIC MODAL -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal-content">
      <img id="mHead" src="" class="m-pfp">
      <div id="mName" class="m-title">Player</div>
      <div id="mTitle" class="m-sub">Title</div>
      <div id="mStats" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
        <div style="background:#222; padding:10px; border-radius:6px;">
          <div style="font-size:0.7rem; color:#888;">POINTS</div>
          <div id="mPoints" style="font-size:1.2rem; font-weight:700; color:#fff;">0</div>
        </div>
        <div style="background:#222; padding:10px; border-radius:6px;">
          <div style="font-size:0.7rem; color:#888;">REGION</div>
          <div id="mRegion" style="font-size:1.2rem; font-weight:700; color:#fff;">NA</div>
        </div>
      </div>
      <button class="m-close" onclick="document.getElementById('modalBackdrop').classList.remove('show')">Close</button>
    </div>
  </div>

  <script>
    // --- CONFIG & DATA ---
    const CATEGORIES = ["sword","axe","crystal","nethpot","uhc","smp","mace"];
    // Icon mapping (using fallback generic icons for demo if local pngs fail)
    const CAT_ICONS = {
      sword: "sword.png", 
      axe: "axe.png", 
      crystal: "crystal.png",
      nethpot: "nethpot.png", 
      uhc: "uhc.png", 
      smp: "smp.png", 
      mace: "mace.png"
    };
    
    // Fallback images for demo purposes
    const FALLBACK_ICON = "https://cdn-icons-png.flaticon.com/512/10697/10697368.png";

    const POINTS_MAP = {
      "HT1": 60, "LT1": 30,
      "HT2": 30, "LT2": 15,
      "HT3": 15, "LT3": 14,
      "HT4": 8,  "LT4": 6,
      "HT5": 4,  "LT5": 1
    };

    const TITLES = [
      { min: 400, t: "Combat Grandmaster" },
      { min: 250, t: "Combat Master" },
      { min: 100, t: "Combat Ace" },
      { min: 50,  t: "Combat Specialist" },
      { min: 20,  t: "Combat Cadet" },
      { min: 10,  t: "Combat Novice" },
      { min: 0,   t: "Beginner" }
    ];

    let players = [];
    let processedList = [];

    // --- LOGIC ---
    function getPoints(tier) { return POINTS_MAP[tier] || 0; }
    function getTitle(pts) { return TITLES.find(x => pts >= x.min).t; }

    async function loadData() {
      // Simulating data loading
      try {
        const res = await fetch('./players.json'); // Replace with real URL
        if(res.ok) {
           const json = await res.json();
           // Handle various JSON structures
           if(Array.isArray(json)) players = json;
           else if(json.players) players = json.players;
           else {
             // Object format
             players = [];
             for(let [k,v] of Object.entries(json)) {
               if(typeof v !== 'object') continue;
               CATEGORIES.forEach(c => {
                 if(v[c]) players.push({ name: k, cat: c, tier: v[c], region: v.region, tester: v.tester });
               });
             }
           }
        }
      } catch(e) { console.log("Using default/empty data"); }
      
      // If empty (for preview), add dummy data matching the screenshot style
      if(players.length === 0) {
        players = [
          { name: "Marlowww", cat: "uhc", tier: "HT1", region: "NA" },
          { name: "Marlowww", cat: "sword", tier: "LT1", region: "NA" },
          { name: "Marlowww", cat: "axe", tier: "LT1", region: "NA" },
          { name: "Marlowww", cat: "crystal", tier: "HT1", region: "NA" },
          { name: "Marlowww", cat: "nethpot", tier: "HT1", region: "NA" },
          { name: "ItzRealMe", cat: "sword", tier: "HT3", region: "NA" },
          { name: "ItzRealMe", cat: "crystal", tier: "HT1", region: "NA" },
          { name: "ItzRealMe", cat: "nethpot", tier: "HT1", region: "NA" },
          { name: "Swight", cat: "axe", tier: "HT1", region: "NA" },
          { name: "Swight", cat: "uhc", tier: "HT1", region: "NA" },
          { name: "coldified", cat: "uhc", tier: "LT1", region: "EU" },
          { name: "coldified", cat: "axe", tier: "LT1", region: "EU" },
          { name: "coldified", cat: "sword", tier: "HT2", region: "EU" }
        ];
      }
    }

    function processData() {
      const map = new Map();
      players.forEach(p => {
        if (!CATEGORIES.includes(p.cat)) return;
        if (!map.has(p.name)) {
          map.set(p.name, { name: p.name, region: p.region || 'NA', tester: !!p.tester, tiers: {}, points: 0 });
        }
        const entry = map.get(p.name);
        // Take highest tier if duplicates
        const curTier = entry.tiers[p.cat];
        if (!curTier || getPoints(p.tier) > getPoints(curTier)) {
          entry.tiers[p.cat] = p.tier;
        }
      });

      for (let p of map.values()) {
        let pts = 0;
        Object.values(p.tiers).forEach(t => pts += getPoints(t));
        p.points = pts;
        p.title = getTitle(pts);
      }
      processedList = Array.from(map.values()).sort((a,b) => b.points - a.points);
    }

    // --- RENDERING ---
    const rankingsList = document.getElementById("rankingsList");
    const searchInput = document.getElementById("searchInput");
    let currentFilter = "overall";

    function getTierClass(tierString) {
      if(!tierString) return "tn";
      if(tierString.includes("1")) return "t1";
      if(tierString.includes("2")) return "t2";
      if(tierString.includes("3")) return "t3";
      if(tierString.includes("4")) return "t4";
      return "t5";
    }

    function render() {
      const term = searchInput.value.toLowerCase();
      rankingsList.innerHTML = "";

      let displayList = [];
      
      if(currentFilter === "overall") {
        displayList = processedList;
      } else {
        // Filter logic for specific tabs if you want a separate view
        // For now, let's keep the main list but filter by who has the tier
        displayList = processedList.filter(p => p.tiers[currentFilter]);
      }

      displayList = displayList.filter(p => p.name.toLowerCase().includes(term));

      displayList.forEach((p, index) => {
        const rank = index + 1;
        
        // Determine Rank Class
        let rankClass = "rank-n";
        if(rank === 1) rankClass = "rank-1";
        if(rank === 2) rankClass = "rank-2";
        if(rank === 3) rankClass = "rank-3";

        // Determine Region Class
        const regClass = (p.region === "EU") ? "reg-EU" : (p.region === "ASIA" ? "reg-ASIA" : "reg-NA");

        // Generate Tiers HTML
        // We iterate through ALL categories to create the grid seen in screenshot
        const tiersHtml = CATEGORIES.map(cat => {
          const t = p.tiers[cat];
          const hasTier = !!t;
          const badgeClass = getTierClass(t);
          
          return `
            <div class="tier-group" title="${cat}">
              <img src="${CAT_ICONS[cat]}" class="tg-icon ${hasTier?'active':''}" onerror="this.src='${FALLBACK_ICON}'">
              <div class="tg-badge ${badgeClass}">${t || '-'}</div>
            </div>
          `;
        }).join('');

        const row = document.createElement("div");
        row.className = `player-row ${rankClass}`;
        row.innerHTML = `
          <!-- 1. Rank -->
          <div class="rank-box">
            ${rank}.
          </div>

          <!-- 2. Player -->
          <div class="player-cell">
            <img src="https://vzge.me/bust/${p.name}" class="player-bust" loading="lazy" onerror="this.src='https://minotar.net/bust/MHF_Steve/100.png'">
            <div class="player-text">
              <div class="p-name">${p.name}</div>
              <div class="p-sub">
                <span class="diamond-icon">❖</span> 
                ${p.title} <span style="color:#4b5563; margin-left:4px;">(${p.points} points)</span>
              </div>
            </div>
          </div>

          <!-- 3. Region -->
          <div class="region-cell">
            <div class="region-badge ${regClass}">${p.region}</div>
          </div>

          <!-- 4. Tiers -->
          <div class="tiers-cell">
            ${tiersHtml}
          </div>
        `;
        
        row.onclick = () => openModal(p);
        rankingsList.appendChild(row);
      });
    }

    // --- MODAL ---
    function openModal(p) {
      document.getElementById('mHead').src = `https://vzge.me/bust/${p.name}`;
      document.getElementById('mName').textContent = p.name;
      document.getElementById('mTitle').textContent = p.title;
      document.getElementById('mPoints').textContent = p.points;
      document.getElementById('mRegion').textContent = p.region;
      document.getElementById('modalBackdrop').classList.add('show');
    }

    // --- EVENTS ---
    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      };
    });

    searchInput.oninput = render;

    // --- INIT ---
    (async () => {
      await loadData();
      processData();
      render();
    })();

  </script>
</body>
</html>
