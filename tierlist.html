<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>INVIS X | Monochrome</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* --- THEME: VOID & LIGHT --- */
      --bg-deep: #000000;
      --bg-panel: #050505;
      --bg-card: #0a0a0a;
      
      --border-dim: rgba(255, 255, 255, 0.1);
      --border-bright: rgba(255, 255, 255, 0.3);
      --border-glow: rgba(255, 255, 255, 0.6);

      --text-main: #ffffff;
      --text-muted: #888888;
      
      /* Glow Effects */
      --glow-text: 0 0 10px rgba(255, 255, 255, 0.5);
      --glow-text-intense: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.4);
      --glow-box: 0 0 15px rgba(255, 255, 255, 0.05);
      --glow-box-hover: 0 0 25px rgba(255, 255, 255, 0.15);
      
      --font-main: 'Poppins', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Force all images/icons to be Grayscale/White */
    img:not(.player-head):not(.pfp-img):not(.tp-head) {
      filter: grayscale(100%) brightness(200%);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    a { text-decoration: none; color: inherit; transition: 0.3s; }
    button { font-family: inherit; cursor: pointer; }

    /* Stars Canvas */
    canvas#stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.6; /* Brighter stars */
      pointer-events: none;
    }

    /* --- Layout --- */
    .app-layout { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--border-dim);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      z-index: 50;
    }

    .sidebar-header {
      padding: 30px 24px;
      border-bottom: 1px solid var(--border-dim);
    }
    
    .brand {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      text-shadow: var(--glow-text);
      letter-spacing: -1px;
    }
    .brand-sub {
      font-size: 0.7rem;
      color: #aaa;
      letter-spacing: 4px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      color: #666;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      background: transparent;
      border: 1px solid transparent;
      width: 100%;
    }
    .nav-btn:hover {
      color: #fff;
      text-shadow: 0 0 8px rgba(255,255,255,0.5);
    }
    .nav-btn[aria-pressed="true"] {
      background: #000;
      border-color: var(--border-bright);
      color: #fff;
      box-shadow: inset 0 0 15px rgba(255,255,255,0.05);
      text-shadow: 0 0 10px rgba(255,255,255,0.6);
    }
    .nav-btn img { width: 18px; height: 18px; object-fit: contain; opacity: 0.5; transition: 0.3s; }
    .nav-btn[aria-pressed="true"] img { opacity: 1; filter: drop-shadow(0 0 5px white); }

    .sidebar-footer {
      padding: 20px;
      border-top: 1px solid var(--border-dim);
      font-size: 0.7rem;
      color: #333;
      text-align: center;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: transparent;
    }

    .topbar {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-bottom: 1px solid var(--border-dim);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(255,255,255,0.3);
    }

    .topbar-actions { display: flex; gap: 16px; align-items: center; }

    .search-wrapper { position: relative; width: 280px; }

    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-dim);
      color: #fff;
      padding: 10px 12px 10px 40px;
      border-radius: 50px; /* Pill shape */
      font-size: 0.85rem;
      outline: none;
      transition: all 0.3s;
      font-family: var(--font-main);
    }

    .search-input:focus { 
      border-color: var(--border-bright); 
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
      background: #000;
    }

    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #666;
      pointer-events: none;
      transition: 0.3s;
    }
    .search-input:focus ~ .search-icon { color: #fff; }

    .btn-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 20px;
      border-radius: 50px;
      border: 1px solid var(--border-dim);
      background: transparent;
      color: #aaa;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.3s;
    }
    .btn-info:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }

    .content-area { padding: 40px; flex: 1; }

    /* --- List Layout (Overall) --- */
    .overall-grid { display: grid; gap: 10px; }

    .player-card-row {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      background: rgba(10,10,10,0.6);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      padding: 12px 24px;
      gap: 20px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    
    .player-card-row::before {
      content:''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      transform: translateX(-100%); transition: 0.5s;
    }
    .player-card-row:hover::before { transform: translateX(100%); }

    .player-card-row:hover {
      transform: translateY(-2px) scale(1.005);
      border-color: var(--border-bright);
      background: #000;
      box-shadow: var(--glow-box-hover);
    }

    .rank-num {
      font-weight: 800;
      font-size: 1.2rem;
      color: #444;
      text-align: center;
      transition: 0.3s;
    }
    /* Top 3 Glowing White */
    .rank-num.top-3 { 
      color: #fff; 
      text-shadow: var(--glow-text-intense);
      font-size: 1.4rem;
    }

    .player-info { display: flex; align-items: center; gap: 16px; }

    .player-head {
      width: 40px; height: 40px;
      border-radius: 8px;
      background: #111;
      object-fit: cover;
      border: 1px solid #333;
      filter: grayscale(100%);
      transition: 0.3s;
    }
    .player-card-row:hover .player-head { filter: grayscale(0%); border-color: #fff; }

    .player-details { display: flex; flex-direction: column; gap: 2px; }

    .player-name {
      font-weight: 700;
      font-size: 1rem;
      color: #eee;
      letter-spacing: 0.5px;
    }
    .player-card-row:hover .player-name { text-shadow: 0 0 8px rgba(255,255,255,0.6); }

    .player-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.7rem; color: #666; font-weight: 500;
    }
    
    .role-badge {
      font-size: 0.6rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: transparent;
      color: #888;
      border: 1px solid #333;
    }
    /* Tester Badge - Now Glowing White Box */
    .role-badge.tester { 
      background: #fff; 
      color: #000; 
      border-color: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.6);
    }

    .player-stats { display: flex; align-items: center; gap: 30px; }

    .stat-box { text-align: right; }
    .stat-label { font-size: 0.6rem; color: #555; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .stat-value { font-size: 1.2rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

    .tier-pills { display: flex; gap: 4px; }
    .mini-pill {
      width: 26px; height: 26px;
      border-radius: 4px;
      background: #050505;
      border: 1px solid #222;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700;
      color: #444;
      transition: 0.2s;
    }
    .mini-pill.active { 
      color: #fff; 
      border-color: #666; 
      background: #111; 
      text-shadow: 0 0 5px white;
    }

    /* --- Tier Board Layout (Columns) --- */
    .tier-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      align-items: start;
    }

    .tier-col {
      background: rgba(10,10,10,0.5);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
    }
    .tier-col:hover { border-color: var(--border-bright); box-shadow: var(--glow-box); }

    /* UNIFIED WHITE HEADERS - Opacity defines hierarchy */
    .tier-header {
      padding: 12px;
      text-align: center;
      font-weight: 900;
      font-size: 0.9rem;
      letter-spacing: 2px;
      background: #000;
      border-bottom: 1px solid var(--border-dim);
      color: #fff;
    }
    
    /* Specific styling per tier number to keep structure but mono color */
    .tier-col:nth-child(1) .tier-header { border-top: 3px solid #fff; text-shadow: 0 0 10px #fff; } 
    .tier-col:nth-child(2) .tier-header { border-top: 3px solid rgba(255,255,255,0.7); }
    .tier-col:nth-child(3) .tier-header { border-top: 3px solid rgba(255,255,255,0.5); }
    .tier-col:nth-child(4) .tier-header { border-top: 3px solid rgba(255,255,255,0.3); }
    .tier-col:nth-child(5) .tier-header { border-top: 3px solid rgba(255,255,255,0.1); color: #888; }

    .tier-list {
      padding: 8px;
      max-height: 70vh;
      overflow-y: auto;
      scrollbar-width: thin;
      background: rgba(0,0,0,0.3);
    }
    
    .tier-player {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 6px;
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }
    .tier-player:hover { 
      background: #000; 
      border-color: #333; 
      box-shadow: 0 0 10px rgba(255,255,255,0.1); 
    }

    .tp-head { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; filter: grayscale(100%); }
    .tier-player:hover .tp-head { filter: grayscale(0%); }
    
    .tp-name { font-size: 0.8rem; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; color: #ccc; }
    .tier-player:hover .tp-name { color: #fff; }
    
    /* Small Badges in Lists */
    .tp-badge { 
      font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; 
      border: 1px solid #333; background: #000; color: #666;
    }

    /* HT = High Tier (White Glow), LT = Low Tier (Dim) */
    .tp-badge[data-tier^="HT"] { 
      color: #fff; border-color: #fff; box-shadow: 0 0 5px rgba(255,255,255,0.4);
    }
    .tp-badge[data-tier^="LT"] { 
      color: #888; border-color: #444; 
    }

    /* --- Modals (Cyber Style) --- */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0; transition: opacity 0.2s;
    }
    .modal-backdrop.show { display: flex; opacity: 1; }

    .modal {
      background: #000;
      border-radius: 20px;
      width: 100%; max-width: 440px;
      box-shadow: 0 0 40px rgba(255,255,255,0.1), inset 0 0 0 1px #333;
      transform: scale(0.95); transition: 0.3s;
      position: relative;
      padding: 40px 30px 30px;
    }
    .modal-backdrop.show .modal { transform: scale(1); }
    
    .m-close-absolute {
      position: absolute;
      top: 16px; right: 16px;
      background: transparent; border: none;
      color: #666; font-size: 1.5rem;
      cursor: pointer; transition: 0.2s;
      width: 32px; height: 32px;
      display: grid; place-items: center;
      border-radius: 50%;
    }
    .m-close-absolute:hover { color: #fff; text-shadow: 0 0 10px white; }

    .pfp-container { display: flex; justify-content: center; margin-bottom: 20px; }
    .pfp-img {
      width: 110px; height: 110px;
      border-radius: 16px;
      border: 2px solid #fff;
      box-shadow: 0 0 25px rgba(255,255,255,0.2);
      object-fit: cover;
      background: #000;
    }

    .badge-row { display: flex; justify-content: center; margin-bottom: 16px; }
    .tester-badge {
      background: #fff; color: #000;
      padding: 6px 16px; border-radius: 50px;
      font-size: 0.75rem; font-weight: 800;
      display: flex; align-items: center; gap: 8px;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(255,255,255,0.6);
    }
    
    .profile-name {
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    .title-row { display: flex; justify-content: center; margin-bottom: 30px; }
    .title-pill {
      background: #0a0a0a; 
      color: #ccc;
      padding: 6px 18px; border-radius: 50px;
      font-size: 0.85rem; font-weight: 500;
      border: 1px solid #333;
    }

    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-bottom: 30px;
    }
    .stat-item { 
      text-align: center;
      background: #050505;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 12px 6px;
      transition: 0.2s;
    }
    .stat-item:hover { border-color: #555; box-shadow: 0 0 10px rgba(255,255,255,0.05); }

    .stat-lbl { font-size: 0.65rem; color: #666; font-weight: 700; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
    .stat-val { font-size: 1.3rem; font-weight: 800; color: #fff; }
    
    .stat-val.top-3-glow { 
      text-shadow: 0 0 15px rgba(255,255,255,0.8); 
      color: #fff;
    }

    .breakdown-box {
      background: #050505;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #222;
      position: relative;
    }
    .bb-title {
      text-align: center;
      color: #555; font-size: 0.7rem; font-weight: 800;
      letter-spacing: 2px; margin-bottom: 16px; text-transform: uppercase;
    }
    .bb-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    
    .bd-item { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 44px; }
    
    .bd-icon { 
      width: 36px; height: 36px; 
      background: #000; 
      border-radius: 8px; 
      display: grid; place-items: center; 
      border: 1px solid #333; 
      transition: 0.2s; 
    }
    .bd-icon img { width: 18px; height: 18px; opacity: 0.7; }
    
    .bd-badge { 
      font-size: 0.7rem; font-weight: 800; 
      padding: 3px 0; width: 100%; text-align: center;
      border-radius: 4px; 
      background: #000;
      transition: 0.2s; 
    }
    
    /* Modal Badges: White (HT) vs Dark Gray (LT) */
    .bd-badge.ht { 
      color: #fff; border: 1px solid #fff; 
      box-shadow: 0 0 8px rgba(255,255,255,0.3);
      background: #fff; color: #000; /* Invert for pop */
    }
    .bd-badge.lt { 
      color: #666; border: 1px solid #333; 
    }

    .empty-state { padding: 40px; text-align: center; color: #444; font-style: italic; letter-spacing: 1px; }

    /* Responsive */
    @media (max-width: 1024px) {
      .tier-board { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border-dim); }
      .nav-scroll { flex-direction: row; overflow-x: auto; padding: 12px 16px; align-items: center; }
      .nav-btn { white-space: nowrap; width: auto; font-size: 0.8rem; padding: 8px 12px; }
      .sidebar-header { padding: 16px 24px; align-items: center; }
      .brand { font-size: 1.5rem; }
      .sidebar-footer { display: none; }
      
      .topbar { padding: 0 20px; height: 70px; }
      .page-title { font-size: 1.2rem; }
      .search-wrapper { width: auto; flex: 1; max-width: 200px; }
      .content-area { padding: 20px 16px; }
      
      .player-card-row { grid-template-columns: 40px 1fr; grid-template-rows: auto auto; gap: 12px; padding: 16px; }
      .player-stats { grid-column: 1 / -1; justify-content: space-between; padding-top: 12px; border-top: 1px solid #222; width: 100%; }
      .tier-board { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .tier-board { grid-template-columns: 1fr; }
    }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>

  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">INVIS X</div>
        <div class="brand-sub">MONOCHROME EDITION</div>
      </div>
      
      <nav class="nav-scroll" id="filterTabs">
        <button class="nav-btn" data-filter="overall" aria-pressed="true">
          <img src="overall.png" alt="" onerror="this.style.display='none'"> Overall
        </button>
        <button class="nav-btn" data-filter="sword" aria-pressed="false">
          <img src="sword.png" alt="" onerror="this.style.display='none'"> Sword
        </button>
        <button class="nav-btn" data-filter="axe" aria-pressed="false">
          <img src="axe.png" alt="" onerror="this.style.display='none'"> Axe
        </button>
        <button class="nav-btn" data-filter="crystal" aria-pressed="false">
          <img src="crystal.png" alt="" onerror="this.style.display='none'"> Crystal
        </button>
        <button class="nav-btn" data-filter="nethpot" aria-pressed="false">
          <img src="nethpot.png" alt="" onerror="this.style.display='none'"> Nethpot
        </button>
        <button class="nav-btn" data-filter="uhc" aria-pressed="false">
          <img src="uhc.png" alt="" onerror="this.style.display='none'"> UHC
        </button>
        <button class="nav-btn" data-filter="smp" aria-pressed="false">
          <img src="smp.png" alt="" onerror="this.style.display='none'"> SMP
        </button>
        <button class="nav-btn" data-filter="mace" aria-pressed="false">
          <img src="mace.png" alt="" onerror="this.style.display='none'"> Mace
        </button>
      </nav>

      <div class="sidebar-footer">
        &copy; 2025 INVIS X Network
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="topbar">
        <div class="page-title" id="pageTitle">Overall</div>
        <div class="topbar-actions">
          <div class="search-wrapper">
            <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="SEARCH PLAYERS..." spellcheck="false">
          </div>
          <button id="infoBtn" class="btn-info">
            <span>INFO</span>
          </button>
        </div>
      </header>

      <div class="content-area">
        <div id="overallView" class="overall-grid"></div>
        <div id="tierView" class="tier-board hidden"></div>
      </div>
    </main>
  </div>

  <!-- PLAYER MODAL -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <button id="mClose" class="m-close-absolute">&times;</button>
      
      <div class="pfp-container">
        <img id="mHead" src="" class="pfp-img" alt="">
      </div>

      <div id="mTesterRow" class="badge-row hidden">
        <div class="tester-badge">
          <svg width="12" height="14" fill="currentColor" viewBox="0 0 448 512" style="filter: drop-shadow(0 0 2px white);"><path d="M64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H64zM336 160c0 8.8-7.2 16-16 16s-16-7.2-16-16V128C304 110.3 289.7 96 272 96H176C158.3 96 144 110.3 144 128v32c0 8.8-7.2 16-16 16s-16-7.2-16-16V128c0-35.3 28.7-64 64-64h96c35.3 0 64 28.7 64 64v32z"/></svg>
          OFFICIAL TESTER
        </div>
      </div>

      <div id="mName" class="profile-name">Player</div>

      <div class="title-row">
        <div id="mTitle" class="title-pill">Title</div>
      </div>

      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-lbl">RANK</div>
          <div id="mRank" class="stat-val">#1</div>
        </div>
        <div class="stat-item">
          <div class="stat-lbl">REGION</div>
          <div id="mRegion" class="stat-val">ASIA</div>
        </div>
        <div class="stat-item">
          <div class="stat-lbl">POINTS</div>
          <div id="mPoints" class="stat-val">58</div>
        </div>
      </div>

      <div class="breakdown-box">
        <div class="bb-title">TIER BREAKDOWN</div>
        <div id="mBreakdown" class="bb-grid"></div>
      </div>
    </div>
  </div>

  <!-- INFO MODAL -->
  <div id="infoBackdrop" class="modal-backdrop">
    <div class="modal" style="max-width: 400px; border: 1px solid #fff; box-shadow: 0 0 30px rgba(255,255,255,0.2);">
      <div style="padding:10px; position:relative;">
        <button id="infoClose" class="m-close-absolute">&times;</button>
        <div style="text-align:center; margin-bottom:24px;">
           <h2 style="font-weight:800; font-size:1.5rem; color:#fff; letter-spacing:-0.5px; text-shadow:0 0 10px white;">TITLES & POINTS</h2>
        </div>
        <div style="display:grid; gap:8px;">
          <div style="display:flex;justify-content:space-between;padding:12px;background:#050505;border-radius:8px;border:1px solid #333;"><span>Combat Grandmaster</span> <span style="font-weight:700;color:#fff;text-shadow:0 0 5px white;">400+</span></div>
          <div style="display:flex;justify-content:space-between;padding:12px;background:#050505;border-radius:8px;border:1px solid #333;"><span>Combat Master</span> <span style="font-weight:700;color:#ddd;">250+</span></div>
          <div style="display:flex;justify-content:space-between;padding:12px;background:#050505;border-radius:8px;border:1px solid #333;"><span>Combat Ace</span> <span style="font-weight:700;color:#bbb;">100+</span></div>
          <div style="display:flex;justify-content:space-between;padding:12px;background:#050505;border-radius:8px;border:1px solid #333;"><span>Combat Specialist</span> <span style="font-weight:700;color:#999;">50+</span></div>
          <div style="display:flex;justify-content:space-between;padding:12px;background:#050505;border-radius:8px;border:1px solid #333;"><span>Combat Cadet</span> <span style="font-weight:700;color:#777;">20+</span></div>
          <div style="display:flex;justify-content:space-between;padding:12px;background:#050505;border-radius:8px;border:1px solid #333;"><span>Combat Novice</span> <span style="font-weight:700;color:#555;">10+</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Stars Background (Brighter white) ---
    const starCanvas = document.getElementById("stars");
    const starCtx = starCanvas.getContext("2d");
    
    function resizeStars() {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeStars);
    resizeStars();

    const stars = Array(200).fill().map(() => ({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height,
      r: Math.random() * 1.5,
      a: Math.random() * 0.8 + 0.2, // Higher opacity
      s: Math.random() * 0.3 + 0.1
    }));

    function animateStars() {
      starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
      stars.forEach(st => {
        starCtx.beginPath();
        starCtx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        // Pure White Glow
        starCtx.shadowBlur = 4;
        starCtx.shadowColor = "white";
        starCtx.fillStyle = `rgba(255, 255, 255, ${st.a})`;
        starCtx.fill();
        starCtx.shadowBlur = 0; // Reset
        
        st.y -= st.s;
        if (st.y < 0) { st.y = starCanvas.height; st.x = Math.random() * starCanvas.width; }
      });
      requestAnimationFrame(animateStars);
    }
    animateStars();

    // --- Data Logic (Unchanged, just visuals) ---
    let players = [];
    const CATEGORIES = ["sword","axe","crystal","nethpot","uhc","smp","mace"];
    const CAT_ICONS = {
      sword: "sword.png", axe: "axe.png", crystal: "crystal.png",
      nethpot: "nethpot.png", uhc: "uhc.png", smp: "smp.png", mace: "mace.png"
    };

    const DEFAULT_PLAYERS = [];

    const POINTS_MAP = {
      "HT1": 60, "LT1": 30,
      "HT2": 30, "LT2": 15,
      "HT3": 15, "LT3": 14,
      "HT4": 8,  "LT4": 6,
      "HT5": 4,  "LT5": 1
    };

    const TITLES = [
      { min: 400, t: "Combat Grandmaster" },
      { min: 250, t: "Combat Master" },
      { min: 100, t: "Combat Ace" },
      { min: 50,  t: "Combat Specialist" },
      { min: 20,  t: "Combat Cadet" },
      { min: 10,  t: "Combat Novice" },
      { min: 0,   t: "Beginner" }
    ];

    function getImageUrl(name, type = 'bust') {
      const cleanName = name ? name.trim() : 'MHF_Steve';
      return type === 'bust' 
        ? `https://vzge.me/bust/${cleanName}` 
        : `https://vzge.me/face/${cleanName}`;
    }

    async function loadData() {
      const urls = [
        "./players.json",
        "https://raw.githubusercontent.com/nyiyuji016-rgb/invis-x/main/players.json"
      ];
      
      for (let url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const json = await res.json();
            let raw = Array.isArray(json) ? json : (json.players || []);
            
            if (!Array.isArray(raw) && typeof json === 'object') {
               raw = [];
               for(let [k,v] of Object.entries(json)) {
                 if(typeof v !== 'object') continue;
                 CATEGORIES.forEach(c => {
                   if(v[c]) raw.push({ name: k, cat: c, tier: v[c], region: v.region, tester: v.tester });
                 });
               }
            }

            if (raw.length) {
              players = raw;
              return;
            }
          }
        } catch(e) {}
      }
      players = DEFAULT_PLAYERS; 
    }

    function getPoints(tier) { return POINTS_MAP[tier] || 0; }
    function getTitle(pts) { return TITLES.find(x => pts >= x.min).t; }
    
    function processData() {
      const map = new Map();
      
      players.forEach(p => {
        if (!CATEGORIES.includes(p.cat)) return;
        if (!map.has(p.name)) {
          map.set(p.name, { 
            name: p.name, 
            region: p.region || '—', 
            tester: !!p.tester,
            tiers: {}, 
            points: 0 
          });
        }
        const entry = map.get(p.name);
        const curTier = entry.tiers[p.cat];
        if (!curTier || getPoints(p.tier) > getPoints(curTier)) {
          entry.tiers[p.cat] = p.tier;
        }
      });

      for (let p of map.values()) {
        let pts = 0;
        Object.values(p.tiers).forEach(t => pts += getPoints(t));
        p.points = pts;
        p.title = getTitle(pts);
      }

      const sorted = Array.from(map.values()).sort((a,b) => b.points - a.points || a.name.localeCompare(b.name));
      return { list: sorted, map };
    }

    const overallView = document.getElementById("overallView");
    const tierView = document.getElementById("tierView");
    const searchInput = document.getElementById("searchInput");
    const pageTitle = document.getElementById("pageTitle");
    let currentFilter = "overall";
    let processedData = { list:[], map: new Map() };

    function render() {
      const term = searchInput.value.toLowerCase();
      const niceName = currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1);
      pageTitle.textContent = niceName;

      if (currentFilter === "overall") {
        tierView.classList.add("hidden");
        overallView.classList.remove("hidden");
        renderOverall(term);
      } else {
        overallView.classList.add("hidden");
        tierView.classList.remove("hidden");
        renderTier(term);
      }
    }

    function renderOverall(term) {
      overallView.innerHTML = "";
      const filtered = processedData.list.filter(p => p.name.toLowerCase().includes(term));
      
      if (!filtered.length) {
        overallView.innerHTML = `<div class="empty-state">No agents found in database.</div>`;
        return;
      }

      filtered.forEach((p, idx) => {
        const el = document.createElement("div");
        el.className = "player-card-row";
        
        const breakdownHtml = CATEGORIES.map(c => {
          const t = p.tiers[c];
          return `<div class="mini-pill ${t ? 'active' : ''}" title="${c}">${t || '-'}</div>`;
        }).join('');

        el.innerHTML = `
          <div class="rank-num ${idx < 3 ? 'top-3' : ''}">#${idx + 1}</div>
          <div class="player-info">
            <img src="${getImageUrl(p.name, 'bust')}" data-player="${p.name}" class="player-head" loading="lazy" onerror="this.src='https://vzge.me/bust/X-Steve'">
            <div class="player-details">
              <div class="player-name">${p.name}</div>
              <div class="player-meta">
                ${p.tester ? '<span class="role-badge tester">TESTER</span>' : ''}
                <span class="role-badge">${p.region}</span>
                <span>${p.title}</span>
              </div>
            </div>
          </div>
          <div class="player-stats">
             <div class="tier-pills hidden md:flex">${breakdownHtml}</div>
             <div class="stat-box">
               <div class="stat-label">Points</div>
               <div class="stat-value">${p.points}</div>
             </div>
          </div>
        `;
        el.onclick = () => openModal(p, idx+1);
        overallView.appendChild(el);
      });
    }

    function renderTier(term) {
      tierView.innerHTML = "";
      const cols = [1,2,3,4,5];
      const tierMap = { 1: [], 2: [], 3: [], 4: [], 5: [] };

      const rawFiltered = players.filter(p => p.cat === currentFilter && p.name.toLowerCase().includes(term));
      
      rawFiltered.forEach(p => {
        const m = p.tier.match(/(\d)$/);
        if (m) {
          const t = parseInt(m[1]);
          if (tierMap[t]) tierMap[t].push(p);
        }
      });

      Object.keys(tierMap).forEach(k => {
        tierMap[k].sort((a,b) => {
           const aH = a.tier.startsWith("HT");
           const bH = b.tier.startsWith("HT");
           if (aH && !bH) return -1;
           if (!aH && bH) return 1;
           return a.name.localeCompare(b.name);
        });
      });

      cols.forEach(num => {
        const col = document.createElement("div");
        col.className = "tier-col";
        const items = tierMap[num];
        
        let html = `<div class="tier-header">TIER ${num}</div><div class="tier-list">`;
        if (items.length === 0) {
           html += `<div style="padding:20px;text-align:center;font-size:0.7rem;color:#333;">VOID</div>`;
        } else {
          items.forEach(p => {
            html += `
              <div class="tier-player" onclick="findAndOpen('${p.name}')">
                <img src="${getImageUrl(p.name, 'face')}" class="tp-head" loading="lazy" onerror="this.src='https://vzge.me/face/X-Steve'">
                <div class="tp-name">${p.name}</div>
                <div class="tp-badge" data-tier="${p.tier}">${p.tier}</div>
              </div>
            `;
          });
        }
        html += `</div>`;
        col.innerHTML = html;
        tierView.appendChild(col);
      });
    }

    // --- Modal Logic ---
    const modalBackdrop = document.getElementById("modalBackdrop");
    const mClose = document.getElementById("mClose");
    const mHead = document.getElementById("mHead");
    
    function openModal(data, rank) {
      mHead.src = getImageUrl(data.name, 'bust');
      mHead.onerror = function() { this.src='https://vzge.me/bust/X-Steve'; };

      document.getElementById("mName").textContent = data.name;
      
      const testerRow = document.getElementById("mTesterRow");
      if (data.tester) testerRow.classList.remove("hidden");
      else testerRow.classList.add("hidden");

      document.getElementById("mTitle").textContent = data.title;
      
      const rankEl = document.getElementById("mRank");
      rankEl.textContent = rank ? `#${rank}` : '-';
      if (rank && rank <= 3) rankEl.classList.add("top-3-glow");
      else rankEl.classList.remove("top-3-glow");

      document.getElementById("mPoints").textContent = data.points;
      document.getElementById("mRegion").textContent = data.region || '-';
      
      const bd = document.getElementById("mBreakdown");
      bd.innerHTML = "";
      CATEGORIES.forEach(c => {
        const t = data.tiers[c];
        const cls = t ? (t.startsWith("HT") ? "ht" : "lt") : "";
        
        const div = document.createElement("div");
        div.className = "bd-item";
        div.innerHTML = `
          <div class="bd-icon" title="${c}"><img src="${CAT_ICONS[c]}" alt="" onerror="this.style.display='none'"></div>
          <div class="bd-badge ${cls}">${t || '-'}</div>
        `;
        bd.appendChild(div);
      });

      modalBackdrop.classList.add("show");
    }

    function closeModal() { modalBackdrop.classList.remove("show"); }
    mClose.onclick = closeModal;
    modalBackdrop.onclick = (e) => { if(e.target === modalBackdrop) closeModal(); }

    function findAndOpen(name) {
      const p = processedData.map.get(name);
      if (p) {
        const idx = processedData.list.indexOf(p);
        openModal(p, idx + 1);
      }
    }

    const infoBtn = document.getElementById("infoBtn");
    const infoBackdrop = document.getElementById("infoBackdrop");
    const infoClose = document.getElementById("infoClose");
    
    infoBtn.onclick = () => infoBackdrop.classList.add("show");
    infoClose.onclick = () => infoBackdrop.classList.remove("show");
    infoBackdrop.onclick = (e) => { if(e.target===infoBackdrop) infoBackdrop.classList.remove("show"); }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        currentFilter = btn.dataset.filter;
        render();
        if (window.innerWidth < 768) {
           btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }
    });
    
    searchInput.oninput = render;

    (async () => {
      await loadData();
      processedData = processData();
      render();
    })();

  </script>
</body>
</html>
