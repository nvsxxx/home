<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>INVIS X | Ranked</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* --- COLOR PALETTE --- */
      --bg-body: #06070a; /* Very dark blue-black */
      --bg-nav: #0b0d12;
      --bg-subnav: #0f1116;
      --bg-card: #15171e;
      --bg-card-hover: #1c1f26;

      --border-main: #23262d;
      --text-main: #fff;
      --text-sub: #9ca3af;
      
      --font-display: 'Poppins', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; transition: 0.2s; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* --- GLOBAL NAVBAR --- */
    .navbar {
      height: 64px;
      background: var(--bg-nav);
      border-bottom: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky; top: 0; z-index: 50;
    }

    .brand {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #facc15, #f97316); /* Gold gradient logo */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-right: 40px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-right: auto;
    }

    .nav-link {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; font-weight: 500; color: #9ca3af;
      transition: 0.2s;
    }
    .nav-link:hover { color: #fff; }
    .nav-link svg { width: 18px; height: 18px; }

    /* Search Bar in Header */
    .search-container {
      position: relative;
      width: 280px;
    }
    .search-input {
      width: 100%;
      background: #1a1d24;
      border: 1px solid #2f333d;
      color: #fff;
      padding: 8px 16px 8px 40px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }
    .search-input:focus { background: #22252e; border-color: #4b5563; }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #6b7280; width: 16px; height: 16px; pointer-events: none;
    }

    /* --- CATEGORY SUB-NAV --- */
    .cat-bar {
      background: var(--bg-subnav);
      border-bottom: 1px solid var(--border-main);
      display: flex;
      padding: 0 32px;
      overflow-x: auto;
      scrollbar-width: none; /* Hide scrollbar Firefox */
      position: sticky; top: 64px; z-index: 40;
    }
    .cat-bar::-webkit-scrollbar { display: none; }

    .cat-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 24px;
      min-width: 90px;
      color: #6b7280;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      position: relative;
    }
    
    .cat-tab:hover { background: rgba(255,255,255,0.02); color: #9ca3af; }
    
    .cat-tab.active {
      color: #fff;
      border-bottom-color: #fff;
    }

    .cat-icon {
      width: 24px; height: 24px;
      object-fit: contain;
      filter: grayscale(100%) opacity(0.6);
      transition: 0.2s;
    }
    
    .cat-tab:hover .cat-icon { filter: grayscale(50%) opacity(0.8); }
    .cat-tab.active .cat-icon { filter: grayscale(0%) opacity(1); transform: scale(1.1); }
    
    .cat-text { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em; }

    /* --- MAIN CONTENT AREA --- */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px;
    }

    /* --- LIST & GRID STYLES --- */
    .overall-grid { display: flex; flex-direction: column; gap: 12px; }

    .player-card-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 12px;
      padding: 12px 24px; transition: 0.2s; cursor: pointer; min-height: 84px;
    }
    .player-card-row:hover {
      transform: translateY(-2px); border-color: #3b404d; background: var(--bg-card-hover);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    /* Left Section: Rank + Avatar + Info */
    .pc-left { display: flex; align-items: center; gap: 24px; flex: 1; min-width: 0; }
    
    .rank-num {
      font-family: var(--font-display); font-weight: 900; font-style: italic;
      font-size: 1.8rem; color: #fff; width: 40px; text-align: center;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }
    
    .player-head { 
      width: 48px; height: 48px; border-radius: 8px; 
      background: #1a1a1a; object-fit: cover; border: 1px solid #333;
    }

    .pc-info { display: flex; flex-direction: column; justify-content: center; }
    
    .pc-name-row { display: flex; align-items: center; gap: 10px; }
    .pc-name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: #fff; letter-spacing: 0.01em; }
    
    .pc-subtext {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.85rem; color: #777; margin-top: 2px; font-weight: 500;
    }
    .rank-icon-svg { width: 14px; height: 14px; flex-shrink: 0; }

    .role-badge { 
      font-size: 0.6rem; text-transform: uppercase; font-weight: 700; 
      padding: 2px 6px; border-radius: 4px; border: 1px solid #333; 
    }
    .role-badge.tester { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }

    /* Right Section: Region + Categories */
    .pc-right { display: flex; align-items: center; gap: 32px; }

    .region-badge {
      font-family: var(--font-display); font-weight: 800; font-size: 0.9rem;
      background: rgba(34, 197, 94, 0.1); color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
      padding: 8px 12px; border-radius: 8px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    .stats-row { display: flex; align-items: center; gap: 12px; }
    
    .stat-col {
      display: flex; flex-direction: column; align-items: center; gap: 6px; width: 40px;
    }

    .cat-icon-circle {
      width: 30px; height: 30px; border-radius: 50%;
      background: #0f1116; border: 1px solid #23262d;
      display: grid; place-items: center;
    }
    .cat-icon-circle img { width: 16px; height: 16px; opacity: 0.8; }

    .tier-pill {
      font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
      padding: 2px 0; width: 100%; text-align: center; border-radius: 10px;
      color: #6b7280; background: transparent; 
      font-family: var(--font-body);
    }

    /* Tier Styles */
    .tier-pill[data-tier*="1"] { color: #facc15; }
    .tier-pill[data-tier*="2"] { color: #e5e7eb; }
    .tier-pill[data-tier*="3"] { color: #fb923c; }
    .tier-pill[data-tier*="4"] { color: #4ade80; }
    .tier-pill[data-tier*="5"] { color: #60a5fa; }
    .tier-pill:empty { opacity: 0; }

    /* --- TIER BOARD (COLUMNS) --- */
    .tier-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; align-items: start; }
    .tier-col {
      background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 10px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .tier-header {
      padding: 12px; text-align: center; font-family: var(--font-display);
      font-weight: 800; font-size: 0.9rem; letter-spacing: 0.05em;
      background: #1a1d24; border-bottom: 1px solid var(--border-main); position: relative;
    }
    
    /* Tier Colors */
    .tier-col:nth-child(1) { border-top: 3px solid #ef4444; } .tier-col:nth-child(1) .tier-header { color: #ef4444; }
    .tier-col:nth-child(2) { border-top: 3px solid #f97316; } .tier-col:nth-child(2) .tier-header { color: #f97316; }
    .tier-col:nth-child(3) { border-top: 3px solid #eab308; } .tier-col:nth-child(3) .tier-header { color: #eab308; }
    .tier-col:nth-child(4) { border-top: 3px solid #22c55e; } .tier-col:nth-child(4) .tier-header { color: #22c55e; }
    .tier-col:nth-child(5) { border-top: 3px solid #3b82f6; } .tier-col:nth-child(5) .tier-header { color: #3b82f6; }

    .tier-list { padding: 8px; max-height: 75vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #333 transparent; }
    .tier-player {
      display: flex; align-items: center; gap: 10px; padding: 8px;
      border-radius: 6px; cursor: pointer; transition: 0.1s; border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .tier-player:hover { background: #23262d; }
    .tp-head { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }
    .tp-name { font-size: 0.8rem; font-weight: 500; flex: 1; color: #ddd; }
    .tp-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #111; border: 1px solid #333; color: #888; }
    [data-tier*="1"] { color: #ef4444; border-color: #ef4444; background: rgba(239,68,68,0.1); } /* Simplified logic for brevity */

    /* --- MODAL --- */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; transition: opacity 0.2s;
    }
    .modal-backdrop.show { display: flex; opacity: 1; }

    .modal {
      background: var(--bg-card); border-radius: 16px; width: 100%; max-width: 420px;
      border: 1px solid var(--border-main); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      padding: 32px 24px 24px; position: relative; transform: translateY(10px); transition: 0.3s;
    }
    .modal-backdrop.show .modal { transform: translateY(0); }
    .m-close-absolute { position: absolute; top: 12px; right: 12px; font-size: 1.5rem; color: #555; transition: 0.2s; }
    .m-close-absolute:hover { color: #fff; }

    /* Modal Layouts */
    .pfp-container { display: flex; justify-content: center; margin-bottom: 16px; }
    .pfp-img { width: 96px; height: 96px; border-radius: 16px; border: 2px solid #333; background: #111; object-fit: cover; }
    .profile-name { text-align: center; font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .title-row { display: flex; justify-content: center; margin-bottom: 24px; }
    .title-pill { background: #0f1116; color: #ccc; padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; border: 1px solid #23262d; display: flex; align-items: center; gap: 6px; }
    
    .stats-row-modal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .stat-item { text-align: center; background: #1a1d24; border: 1px solid #2f333d; border-radius: 8px; padding: 12px 6px; }
    .stat-lbl { font-size: 0.65rem; color: #666; font-weight: 700; margin-bottom: 2px; text-transform: uppercase; }
    .stat-val { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: #fff; }
    .stat-val.glow { text-shadow: 0 0 15px rgba(255, 255, 255, 0.6); color: #fff; }

    .breakdown-box { background: #0b0d12; border-radius: 12px; padding: 16px; border: 1px solid #23262d; }
    .bb-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .bd-item { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 44px; }
    .bd-icon { width: 32px; height: 32px; background: #15171e; border-radius: 6px; display: grid; place-items: center; border: 1px solid #2f333d; }
    .bd-icon img { width: 16px; height: 16px; opacity: 0.8; }
    .bd-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 0; width: 100%; text-align: center; }
    
    .info-row { display:flex;justify-content:space-between;padding:12px;background:#1a1d24;border-radius:8px;border:1px solid #2f333d;align-items: center; }
    .info-left { display: flex; align-items: center; gap: 8px; color: #ccc; font-weight: 500; }

    /* Responsive */
    @media (max-width: 1024px) { 
      .tier-board { grid-template-columns: repeat(3, 1fr); }
      .nav-links { display: none; } /* Hide nav links on small tablets */
    }
    @media (max-width: 768px) {
      .navbar { padding: 0 16px; }
      .cat-bar { padding: 0 16px; }
      .search-container { width: auto; flex: 1; max-width: 200px; margin-left: auto; }
      .main-container { padding: 16px; }
      .tier-board { grid-template-columns: repeat(2, 1fr); }
      
      .player-card-row { flex-direction: column; align-items: stretch; gap: 16px; padding: 16px; }
      .pc-right { justify-content: space-between; width: 100%; }
      .stats-row { overflow-x: auto; padding-bottom: 4px; flex: 1; justify-content: flex-end; }
    }
    @media (max-width: 500px) { .tier-board { grid-template-columns: 1fr; } }
    .hidden { display: none !important; }
  </style>
</head>

  <script>
    // --- JS LOGIC SAME AS BEFORE ---
    let players = [];
    const CATEGORIES = ["sword","axe","crystal","nethpot","uhc","smp","mace"];
    // Using simple placeholders if files missing
    const CAT_ICONS = {
      sword: "sword.png", axe: "axe.png", crystal: "crystal.png",
      nethpot: "nethpot.png", uhc: "uhc.png", smp: "smp.png", mace: "mace.png"
    };
    
    // Fallback Icon Helper
    const getIcon = (cat) => {
        // Just for demo purposes, if images fail, use these flaticon urls
        const fallbacks = {
           sword: 'https://cdn-icons-png.flaticon.com/512/7502/7502360.png',
           axe: 'https://cdn-icons-png.flaticon.com/512/8146/8146199.png',
           crystal: 'https://cdn-icons-png.flaticon.com/512/2622/2622206.png',

           uhc: 'https://cdn-icons-png.flaticon.com/512/107/107831.png',
           smp: 'https://cdn-icons-png.flaticon.com/512/1453/1453472.png',
           mace: 'https://cdn-icons-png.flaticon.com/512/3338/3338870.png'
        };
        return CAT_ICONS[cat] || fallbacks[cat]; 
    }

    const POINTS_MAP = { "HT1":60, "LT1":30, "HT2":30, "LT2":15, "HT3":15, "LT3":14, "HT4":8, "LT4":6, "HT5":4, "LT5":1 };
    const TITLES = [
      { min: 400, t: "Grandmaster" }, { min: 250, t: "Master" },
      { min: 100, t: "Ace" }, { min: 50,  t: "Specialist" },
      { min: 20,  t: "Cadet" }, { min: 10,  t: "Novice" }, { min: 0,   t: "Beginner" }
    ];

    function getRankConfig(title) {
        let color = '#9ca3af'; 
        const diamond = 'M12 2l10 10-10 10L2 12Z'; 
        switch (title) {
            case 'Grandmaster': color = '#facc15'; break;
            case 'Master': color = '#fbbf24'; break;
            case 'Ace': color = '#f87171'; break;
            case 'Specialist': color = '#c084fc'; break;
            case 'Cadet': color = '#818cf8'; break;
            case 'Novice': color = '#60a5fa'; break;
        }
        return {
            color: color,
            svg: `<svg viewBox="0 0 24 24" class="rank-icon-svg" style="color:${color}; fill:${color}; overflow:visible;"><path d="${diamond}" stroke="rgba(0,0,0,0.5)" stroke-width="1"></path><path d="M12 6l6 6-6 6-6-6Z" fill="rgba(255,255,255,0.4)"></path></svg>`
        };
    }

    function getImageUrl(name, type='bust') {
      const cleanName = name ? name.trim() : 'MHF_Steve';
      return type === 'bust' ? `https://vzge.me/bust/${cleanName}` : `https://vzge.me/face/${cleanName}`;
    }

    async function loadData() {
      const urls = ["./players.json", "https://raw.githubusercontent.com/nyiyuji016-rgb/invis-x/main/players.json"];
      for (let url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const json = await res.json();
            let raw = Array.isArray(json) ? json : (json.players || []);
            if (!Array.isArray(raw) && typeof json === 'object') {
               raw = [];
               for(let [k,v] of Object.entries(json)) {
                 if(typeof v !== 'object') continue;
                 CATEGORIES.forEach(c => { if(v[c]) raw.push({ name: k, cat: c, tier: v[c], region: v.region, tester: v.tester }); });
               }
            }
            if (raw.length) { players = raw; return; }
          }
        } catch(e) {}
      }
    }

    function processData() {
      const map = new Map();
      players.forEach(p => {
        if (!CATEGORIES.includes(p.cat)) return;
        if (!map.has(p.name)) map.set(p.name, { name: p.name, region: p.region || '—', tester: !!p.tester, tiers: {}, points: 0 });
        const entry = map.get(p.name);
        const curTier = entry.tiers[p.cat];
        const tierPoints = POINTS_MAP[p.tier] || 0;
        const curPoints = POINTS_MAP[curTier] || 0;
        if (!curTier || tierPoints > curPoints) entry.tiers[p.cat] = p.tier;
      });
      for (let p of map.values()) {
        let pts = 0;
        Object.values(p.tiers).forEach(t => pts += (POINTS_MAP[t] || 0));
        p.points = pts;
        p.title = TITLES.find(x => pts >= x.min).t;
      }
      return { list: Array.from(map.values()).sort((a,b) => b.points - a.points || a.name.localeCompare(b.name)), map };
    }

    // --- Rendering ---
    const overallView = document.getElementById("overallView");
    const tierView = document.getElementById("tierView");
    const searchInput = document.getElementById("searchInput");
    let currentFilter = "overall";
    let processedData = { list:[], map: new Map() };

    function render() {
      const term = searchInput.value.toLowerCase();
      if (currentFilter === "overall") {
        tierView.classList.add("hidden");
        overallView.classList.remove("hidden");
        renderOverall(term);
      } else {
        overallView.classList.add("hidden");
        tierView.classList.remove("hidden");
        renderTier(term);
      }
    }

    function renderOverall(term) {
      overallView.innerHTML = "";
      const filtered = processedData.list.filter(p => p.name.toLowerCase().includes(term));
      if (!filtered.length) { overallView.innerHTML = `<div style="text-align:center;padding:40px;color:#555;">No players found.</div>`; return; }

      filtered.forEach((p, idx) => {
        const el = document.createElement("div");
        el.className = "player-card-row";
        
        const statsHtml = CATEGORIES.map(c => {
          const t = p.tiers[c] || "";
          return `<div class="stat-col">
              <div class="cat-icon-circle" title="${c}">
                 <img src="${getIcon(c)}" alt="" onerror="this.style.opacity='0.2'">
              </div>
              <div class="tier-pill" data-tier="${t}">${t}</div>
          </div>`;
        }).join('');

        const rankConfig = getRankConfig(p.title);
        el.innerHTML = `
          <div class="pc-left">
            <div class="rank-num">${idx + 1}.</div>
            <img src="${getImageUrl(p.name, 'bust')}" class="player-head" loading="lazy" onerror="this.src='https://vzge.me/bust/X-Steve'">
            <div class="pc-info">
              <div class="pc-name-row">
                <div class="pc-name">${p.name}</div>
                ${p.tester ? '<span class="role-badge tester">TESTER</span>' : ''}
              </div>
              <div class="pc-subtext" style="color:${rankConfig.color}">
                ${rankConfig.svg}
                <span>${p.title} (${p.points} points)</span>
              </div>
            </div>
          </div>
          <div class="pc-right">
             <div class="region-badge">${p.region}</div>
             <div class="stats-row">${statsHtml}</div>
          </div>
        `;
        el.onclick = () => openModal(p, idx+1);
        overallView.appendChild(el);
      });
    }

    function renderTier(term) {
      tierView.innerHTML = "";
      const cols = [1,2,3,4,5];
      const tierMap = { 1: [], 2: [], 3: [], 4: [], 5: [] };
      const rawFiltered = players.filter(p => p.cat === currentFilter && p.name.toLowerCase().includes(term));
      rawFiltered.forEach(p => {
        const m = p.tier.match(/(\d)$/);
        if (m) {
          const t = parseInt(m[1]);
          if (tierMap[t]) tierMap[t].push(p);
        }
      });
      Object.keys(tierMap).forEach(k => {
        tierMap[k].sort((a,b) => {
           const aH = a.tier.startsWith("HT");
           const bH = b.tier.startsWith("HT");
           if (aH && !bH) return -1;
           if (!aH && bH) return 1;
           return a.name.localeCompare(b.name);
        });
      });
      cols.forEach(num => {
        const col = document.createElement("div"); col.className = "tier-col";
        const items = tierMap[num];
        let html = `<div class="tier-header">TIER ${num}</div><div class="tier-list">`;
        if (items.length === 0) html += `<div style="padding:20px;text-align:center;font-size:0.8rem;color:#444;">—</div>`;
        else {
          items.forEach(p => {
            html += `<div class="tier-player" onclick="findAndOpen('${p.name}')">
                <img src="${getImageUrl(p.name, 'face')}" class="tp-head" loading="lazy" onerror="this.src='https://vzge.me/face/X-Steve'">
                <div class="tp-name">${p.name}</div>
                <div class="tp-badge" data-tier="${p.tier}">${p.tier}</div>
            </div>`;
          });
        }
        html += `</div>`; col.innerHTML = html; tierView.appendChild(col);
      });
    }

    // Modal & Nav Events
    const modalBackdrop = document.getElementById("modalBackdrop");
    const mClose = document.getElementById("mClose");
    function openModal(data, rank) {
      const mHead = document.getElementById("mHead"); mHead.src = getImageUrl(data.name, 'bust');
      mHead.onerror = function() { this.src='https://vzge.me/bust/X-Steve'; };
      document.getElementById("mName").textContent = data.name;
      document.getElementById("mTesterRow").classList.toggle("hidden", !data.tester);
      const mTitle = document.getElementById("mTitle");
      const rankConfig = getRankConfig(data.title);
      mTitle.innerHTML = `${rankConfig.svg} <span>${data.title}</span>`;
      mTitle.style.color = rankConfig.color === '#9ca3af' ? '#ccc' : rankConfig.color;
      mTitle.style.borderColor = rankConfig.color === '#9ca3af' ? '#333' : rankConfig.color;
      
      document.getElementById("mRank").textContent = rank ? `#${rank}` : '-';
      document.getElementById("mPoints").textContent = data.points;
      document.getElementById("mRegion").textContent = data.region || '-';
      
      const bd = document.getElementById("mBreakdown"); bd.innerHTML = "";
      CATEGORIES.forEach(c => {
        const t = data.tiers[c] || "";
        const div = document.createElement("div"); div.className = "bd-item";
        div.innerHTML = `<div class="bd-icon" title="${c}"><img src="${getIcon(c)}" alt=""></div><div class="bd-badge" data-tier="${t}">${t || '-'}</div>`;
        bd.appendChild(div);
      });
      modalBackdrop.classList.add("show");
    }
    function closeModal() { modalBackdrop.classList.remove("show"); }
    mClose.onclick = closeModal; modalBackdrop.onclick = (e) => { if(e.target===modalBackdrop) closeModal(); }
    function findAndOpen(name) {
      const p = processedData.map.get(name);
      if (p) openModal(p, processedData.list.indexOf(p) + 1);
    }

    const infoBtn = document.getElementById("infoBtn");
    const infoBackdrop = document.getElementById("infoBackdrop");
    const infoClose = document.getElementById("infoClose");
    const infoList = document.getElementById("infoList");
    function populateInfo() {
        infoList.innerHTML = "";
        TITLES.forEach(t => {
            const conf = getRankConfig(t.t);
            const div = document.createElement("div"); div.className = "info-row";
            div.innerHTML = `<div class="info-left">${conf.svg}<span style="color:${conf.color}">${t.t}</span></div><div style="font-weight:700; color:#555;">${t.min}+</div>`;
            infoList.appendChild(div);
        });
    }
    populateInfo();
    infoBtn.onclick = () => infoBackdrop.classList.add("show");
    infoClose.onclick = () => infoBackdrop.classList.remove("show");
    infoBackdrop.onclick = (e) => { if(e.target===infoBackdrop) infoBackdrop.classList.remove("show"); }

    document.querySelectorAll(".cat-tab").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".cat-tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
      }
    });
    searchInput.oninput = render;

    (async () => {
      await loadData();
      processedData = processData();
      render();
    })();
  </script>
</body>
</html>
