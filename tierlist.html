<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INVIS X | Leaderboards</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* --- THEME --- */
      --bg-body: #0b0d12;
      --bg-nav: #13151b;
      --bg-card: #161921;
      --bg-card-hover: #1c2029;
      --bg-modal: #0f1116; 
      
      --text-main: #ffffff;
      --text-sub: #9ca3af;

      /* RANK COLORS */
      --rank-1: #fbbf24; 
      --rank-2: #9ca3af; 
      --rank-3: #b45309; 
      --rank-n: #27272a; 

      /* BADGE COLORS */
      --c-1: #fbbf24; /* Gold */
      --c-2: #94a3b8; /* Blue/Grey */
      --c-3: #f97316; /* Orange */
      
      --font-display: 'Poppins', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex; flex-direction: column;
      overflow-x: hidden;
    }

    /* --- ICONS (SVG Styling) --- */
    .icon-svg {
      width: 20px; height: 20px;
      fill: currentColor;
    }

    /* --- NAVBAR --- */
    .navbar {
      background: var(--bg-nav);
      border-bottom: 1px solid #1f222b;
      height: 72px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; position: sticky; top: 0; z-index: 100;
    }

    .nav-tabs { display: flex; height: 100%; gap: 8px; overflow-x: auto; }
    
    .nav-tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 0 16px; min-width: 80px;
      color: #6b7280; font-weight: 600; font-size: 0.8rem;
      border-bottom: 3px solid transparent; transition: 0.2s; cursor: pointer; background: transparent; border: none;
      gap: 4px;
    }
    
    .nav-tab:hover, .nav-tab.active { color: #fff; }
    .nav-tab.active { border-bottom-color: #fff; }
    
    /* SVG Color transition in Nav */
    .nav-tab svg { fill: #6b7280; transition: 0.2s; width: 22px; height: 22px; }
    .nav-tab:hover svg, .nav-tab.active svg { fill: #fff; }

    /* --- MAIN LAYOUT --- */
    .container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; width: 100%; }

    .controls { display: flex; justify-content: flex-end; margin-bottom: 20px; }
    .search-input {
      background: #13151b; border: 1px solid #252830; color: #fff;
      padding: 10px 15px; border-radius: 8px; width: 100%; max-width: 300px;
      outline: none; transition: 0.2s;
    }
    .search-input:focus { border-color: #555; background: #000; }

    /* --- TABLE HEADER --- */
    .thead {
      display: grid; 
      grid-template-columns: 80px 280px 100px 1fr; 
      padding: 0 10px 10px; 
      color: #4b5563; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase;
    }
    .th-center { text-align: center; }
    .th-right { text-align: right; padding-right: 20px; }

    /* --- PLAYER CARD --- */
    .card {
      display: grid;
      grid-template-columns: 80px 280px 100px 1fr;
      background: var(--bg-card);
      border-radius: 8px;
      height: 84px;
      margin-bottom: 8px;
      position: relative;
      transition: transform 0.2s, background 0.2s;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-2px); background: var(--bg-card-hover); z-index: 10; }

    /* Rank Slant */
    .c-rank { position: relative; height: 100%; width: 100%; }
    .rank-bg {
      position: absolute; top: 0; left: 0; bottom: 0; width: 120%;
      background: var(--rank-n);
      clip-path: polygon(0 0, 75% 0, 100% 100%, 0% 100%);
      z-index: 1; border-radius: 8px 0 0 8px;
    }
    .rank-val {
      position: relative; z-index: 2; height: 100%; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; font-style: italic;
      padding-right: 20px; color: #fff;
    }
    /* Rank Colors */
    .r1 .rank-bg { background: var(--rank-1); } .r1 .rank-val { color: #000; text-shadow: 0 1px 0 rgba(255,255,255,0.4); }
    .r2 .rank-bg { background: var(--rank-2); } .r2 .rank-val { color: #000; }
    .r3 .rank-bg { background: var(--rank-3); } .r3 .rank-val { color: #000; }

    /* Player Info */
    .c-info { position: relative; z-index: 5; display: flex; align-items: center; margin-left: -15px; }
    .skin-bust { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.6)); margin-right: 12px; }
    .meta { display: flex; flex-direction: column; justify-content: center; }
    .p-name { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: #fff; }
    .p-title { font-size: 0.75rem; color: #9ca3af; display: flex; align-items: center; gap: 5px; }
    .diamond { color: #fbbf24; font-size: 0.7rem; }

    /* Region */
    .c-region { display: flex; align-items: center; justify-content: center; z-index: 2; }
    .badge-reg { font-weight: 800; font-size: 0.9rem; padding: 4px 8px; border-radius: 4px; background: #333; color: #888; }
    .reg-NA { background: #7f1d1d; color: #fca5a5; }
    .reg-EU { background: #14532d; color: #86efac; }
    .reg-ASIA { background: #1e3a8a; color: #93c5fd; }

    /* Tiers (Main List) */
    .c-tiers { display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; gap: 14px; z-index: 2; }
    .t-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    
    /* SVGs in list */
    .t-svg-icon { width: 18px; height: 18px; fill: #444; }
    .t-active .t-svg-icon { fill: #fff; } /* Icon turns white if active */
    
    /* Specific Icon Colors for visual flair in list */
    .t-active[data-cat="sword"] .t-svg-icon { fill: #60a5fa; }
    .t-active[data-cat="axe"] .t-svg-icon { fill: #60a5fa; }
    .t-active[data-cat="crystal"] .t-svg-icon { fill: #c084fc; }
    .t-active[data-cat="nethpot"] .t-svg-icon { fill: #f472b6; }
    .t-active[data-cat="uhc"] .t-svg-icon { fill: #f87171; }
    .t-active[data-cat="smp"] .t-svg-icon { fill: #4ade80; }
    .t-active[data-cat="mace"] .t-svg-icon { fill: #94a3b8; }

    .t-badge { font-size: 0.6rem; font-weight: 800; padding: 1px 6px; border-radius: 4px; background: #27272a; color: #555; min-width: 30px; text-align: center; }
    .tb-active { color: #fff; } /* Just makes text white, background handled via modal classes usually, keeping minimal here */

    /* --- MODAL (Exact match) --- */
    .modal-wrap {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200;
      display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
    }
    .modal-wrap.show { display: flex; }
    
    .modal-box {
      background: var(--bg-modal); 
      padding: 30px; 
      border-radius: 12px; 
      border: 1px solid #1f222b;
      width: 100%; max-width: 500px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .m-close-btn { position: absolute; top: 12px; right: 12px; color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
    .m-close-btn:hover { color: #fff; }

    /* Header */
    .m-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
    .m-skin { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
    .m-name { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: #fff; }
    .m-tester { font-size: 0.7rem; font-weight: 700; background: #7f1d1d; color: #fca5a5; padding: 2px 8px; border-radius: 4px; margin-top: 4px; letter-spacing: 1px; }

    /* Section Label */
    .m-label { font-size: 0.9rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }

    /* Position Box */
    .m-pos-box {
      background: #13151c; border: 1px solid #27272a; border-radius: 8px;
      padding: 12px 20px; display: flex; align-items: center; margin-bottom: 24px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
    }
    .m-pos-rank { font-family: var(--font-display); font-size: 2rem; font-weight: 900; font-style: italic; color: #fff; margin-right: 12px; }
    
    .m-trophy { width: 24px; height: 24px; fill: #fbbf24; margin-right: 8px; }
    
    .m-pos-text { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; color: #fff; margin-right: 8px; }
    .m-pos-pts { font-size: 1rem; color: #6b7280; font-weight: 500; }

    /* Tiers Box */
    .m-tiers-box {
      background: #13151c; border: 1px solid #27272a; border-radius: 8px;
      padding: 16px; display: flex; flex-wrap: wrap; gap: 14px;
    }

    .mt-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    
    /* Circle Icon Container */
    .mt-circle {
      width: 40px; height: 40px; border-radius: 50%;
      background: #0b0d12; display: grid; place-items: center;
      border: 2px solid #27272a; position: relative;
    }
    .mt-svg { width: 20px; height: 20px; fill: #444; }

    /* Text Badge below circle */
    .mt-badge { font-family: var(--font-display); font-size: 0.9rem; font-weight: 800; color: #444; }

    /* -- Modal Colors (Matches Screenshot) -- */
    /* Level 1 (HT1/LT1) -> Gold/Yellow */
    .lvl-1 .mt-circle { border-color: #713f12; background: rgba(234, 179, 8, 0.05); }
    .lvl-1 .mt-svg { fill: #facc15; }
    .lvl-1 .mt-badge { color: #facc15; }

    /* Level 2 (HT2/LT2) -> Blue/Grey */
    .lvl-2 .mt-circle { border-color: #1e293b; background: rgba(148, 163, 184, 0.05); }
    .lvl-2 .mt-svg { fill: #94a3b8; }
    .lvl-2 .mt-badge { color: #94a3b8; }

    /* Level 3 (HT3/LT3) -> Orange/Brown */
    .lvl-3 .mt-circle { border-color: #431407; background: rgba(249, 115, 22, 0.05); }
    .lvl-3 .mt-svg { fill: #fb923c; }
    .lvl-3 .mt-badge { color: #fb923c; }

    /* Empty */
    .lvl-n .mt-circle { opacity: 0.4; }
    .lvl-n .mt-badge { display: none; }

    /* Responsive */
    @media (max-width: 1024px) {
      .thead, .c-region, .c-tiers { display: none; }
      .card { grid-template-columns: 60px 1fr; height: auto; padding-right: 15px; }
      .rank-bg { width: 100%; clip-path: none; border-radius: 8px 0 0 8px; }
      .c-info { margin-left: 10px; padding: 10px 0; }
    }
  </style>
</head>
<body>

  <!-- SVG DEFINITIONS (Hidden) -->
  <svg style="display:none;">
    <defs>
      <symbol id="icon-overall" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v2a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6v-2H2a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3zm14 2H5v3h14V5zm-8 10a4 4 0 0 0 4-4v-2H9v2a4 4 0 0 0 4 4z"/></symbol>
      <symbol id="icon-sword" viewBox="0 0 24 24"><path d="M14.5 4l-5 5 2.5 2.5 5-5-2.5-2.5zM3 17.5L6.5 21l6.5-6.5-3.5-3.5L3 17.5zM17 2l2 2-2 2 1 1-2 2-1-1-2 2 3.5 3.5-1.5 1.5-3.5-3.5L8 16l-4 4-2-2 4-4-4.5-4.5 3.5-3.5 1.5-1.5 3.5 3.5-2 2 1 1 2-2-1-1 2-2z"/></symbol> <!-- Stylized Sword -->
      <symbol id="icon-axe" viewBox="0 0 24 24"><path d="M3 3h8v8H3zM3 13h8v8H3z"/></symbol> <!-- Abstract Axe/Block -->
      <symbol id="icon-crystal" viewBox="0 0 24 24"><path d="M12 2l6 4v7l-6 4-6-4V6l6-4z"/></symbol> <!-- Hexagon -->
      <symbol id="icon-nethpot" viewBox="0 0 24 24"><path d="M12 2l-2 4H7v4h10V6h-3l-2-4zM7 11h10v9a5 5 0 0 1-10 0v-9z"/></symbol> <!-- Potion -->
      <symbol id="icon-uhc" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol> <!-- Heart -->
      <symbol id="icon-smp" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol> <!-- Pearl/Eye -->
      <symbol id="icon-mace" viewBox="0 0 24 24"><path d="M4 20l5-5 5 5-5 5-5-5zM15 4l5 5-5 5-5-5 5-5z"/></symbol> <!-- Abstract Hammer/Mace -->
    </defs>
  </svg>

  <nav class="navbar">
    <div class="nav-tabs" id="navTabs">
      <button class="nav-tab active" data-filter="overall">
        <svg class="icon-svg"><use href="#icon-overall"></use></svg>
        <span>Overall</span>
      </button>
      <button class="nav-tab" data-filter="sword">
        <svg class="icon-svg"><use href="#icon-sword"></use></svg>
        <span>Sword</span>
      </button>
      <button class="nav-tab" data-filter="axe">
        <svg class="icon-svg"><use href="#icon-axe"></use></svg>
        <span>Axe</span>
      </button>
      <button class="nav-tab" data-filter="crystal">
        <svg class="icon-svg"><use href="#icon-crystal"></use></svg>
        <span>Crystal</span>
      </button>
      <button class="nav-tab" data-filter="nethpot">
        <svg class="icon-svg"><use href="#icon-nethpot"></use></svg>
        <span>Pot</span>
      </button>
      <button class="nav-tab" data-filter="uhc">
        <svg class="icon-svg"><use href="#icon-uhc"></use></svg>
        <span>UHC</span>
      </button>
      <button class="nav-tab" data-filter="smp">
        <svg class="icon-svg"><use href="#icon-smp"></use></svg>
        <span>SMP</span>
      </button>
      <button class="nav-tab" data-filter="mace">
        <svg class="icon-svg"><use href="#icon-mace"></use></svg>
        <span>Mace</span>
      </button>
    </div>
  </nav>

  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search player..." spellcheck="false">
    </div>

    <div class="thead">
      <div class="th-center">#</div>
      <div>PLAYER</div>
      <div class="th-center">REGION</div>
      <div class="th-right">TIERS</div>
    </div>

    <div id="listContainer">
      <!-- Generated via JS -->
    </div>
  </div>

  <!-- PLAYER MODAL -->
  <div id="playerModal" class="modal-wrap">
    <div class="modal-box">
      <button class="m-close-btn" onclick="document.getElementById('playerModal').classList.remove('show')">&times;</button>
      
      <!-- 1. Header -->
      <div class="m-header">
        <img id="mHead" src="" class="m-skin">
        <div id="mName" class="m-name">Player</div>
        <div id="mTester" class="m-tester hidden">TESTER</div>
      </div>

      <!-- 2. Position Section -->
      <div class="m-label">POSITION</div>
      <div class="m-pos-box">
        <div id="mRankNum" class="m-pos-rank">1.</div>
        <svg class="m-trophy"><use href="#icon-overall"></use></svg>
        <div class="m-pos-text">OVERALL</div>
        <div id="mPoints" class="m-pos-pts">(0 points)</div>
      </div>

      <!-- 3. Tiers Section -->
      <div class="m-label">TIERS</div>
      <div id="mTiersGrid" class="m-tiers-box">
        <!-- JS Injects Icons Here -->
      </div>
    </div>
  </div>

  <script>
    // --- Config ---
    const CATEGORIES = ["sword","axe","crystal","nethpot","uhc","smp","mace"];
    const POINTS = { "HT1": 60, "LT1": 30, "HT2": 30, "LT2": 15, "HT3": 15, "LT3": 14, "HT4": 8, "LT4": 6, "HT5": 4, "LT5": 1 };
    const FALLBACK_SKIN = "https://vzge.me/bust/X-Steve";

    let players = [];
    let processedList = [];
    let currentFilter = "overall";

    function getPoints(t) { return POINTS[t] || 0; }
    
    function getTitle(pts) {
      if(pts >= 400) return "Combat Grandmaster";
      if(pts >= 250) return "Combat Master";
      if(pts >= 100) return "Combat Ace";
      return "Novice";
    }

    // Modal Styling Logic
    function getLevelClass(tier) {
      if(!tier) return "lvl-n";
      if(tier.includes('1')) return "lvl-1"; 
      if(tier.includes('2')) return "lvl-2"; 
      if(tier.includes('3')) return "lvl-3"; 
      return "lvl-1"; 
    }

    async function init() {
      // 1. Data Load
      try {
        const req = await fetch('./players.json');
        if(req.ok) {
           const json = await req.json();
           if(Array.isArray(json)) players = json;
           else if(json.players) players = json.players;
           else {
             for(let [k,v] of Object.entries(json)) {
               if(typeof v !== 'object') continue;
               CATEGORIES.forEach(c => {
                 if(v[c]) players.push({ name: k, cat: c, tier: v[c], region: v.region, tester: v.tester });
               });
             }
           }
        }
      } catch(e) {}

      if(!players.length) {
        players = [
          {name:"Marlowww", cat:"uhc", tier:"HT1", region:"NA"},
          {name:"Marlowww", cat:"sword", tier:"LT1", region:"NA"},
          {name:"Marlowww", cat:"nethpot", tier:"HT1", region:"NA"},
          {name:"ItzRealMe", cat:"sword", tier:"HT3", region:"NA"},
          {name:"ItzRealMe", cat:"crystal", tier:"HT1", region:"NA"},
          {name:"coldified", cat:"uhc", tier:"LT1", region:"EU"},
          {name:"BlvckWlf", cat:"axe", tier:"HT2", region:"ASIA"}
        ];
      }

      // 2. Group
      const map = new Map();
      players.forEach(p => {
        if(!CATEGORIES.includes(p.cat)) return;
        if(!map.has(p.name)) {
          map.set(p.name, { name: p.name, region: p.region||"NA", tester: !!p.tester, tiers: {}, total: 0 });
        }
        const entry = map.get(p.name);
        const cur = entry.tiers[p.cat];
        if(!cur || getPoints(p.tier) > getPoints(cur)) {
          entry.tiers[p.cat] = p.tier;
        }
      });

      for(let p of map.values()) {
        let t = 0;
        Object.values(p.tiers).forEach(tier => t += getPoints(tier));
        p.total = t;
        p.title = getTitle(t);
      }

      processedList = Array.from(map.values()).sort((a,b) => b.total - a.total);
      
      render();
    }

    function render() {
      const listContainer = document.getElementById("listContainer");
      const filterTerm = document.getElementById("searchInput").value.toLowerCase();
      listContainer.innerHTML = "";

      let displayData = processedList;
      if(currentFilter !== "overall") {
        displayData = processedList.filter(p => p.tiers[currentFilter]);
      }
      displayData = displayData.filter(p => p.name.toLowerCase().includes(filterTerm));

      if(!displayData.length) {
        listContainer.innerHTML = `<div style="text-align:center; padding:40px; color:#555;">No players found</div>`;
        return;
      }

      displayData.forEach((p, index) => {
        const actualRank = processedList.indexOf(p) + 1;
        
        let rankClass = "rn";
        if(actualRank === 1) rankClass = "r1";
        if(actualRank === 2) rankClass = "r2";
        if(actualRank === 3) rankClass = "r3";

        const regClass = `reg-${p.region}`;

        // Main List Tiers
        const tiersHtml = CATEGORIES.map(cat => {
          const t = p.tiers[cat];
          const hasTier = !!t;
          return `
            <div class="t-col ${hasTier?'t-active':''}" data-cat="${cat}">
              <svg class="t-svg-icon"><use href="#icon-${cat}"></use></svg>
              <div class="t-badge ${hasTier?'tb-active':''}">${t || '-'}</div>
            </div>
          `;
        }).join('');

        const el = document.createElement("div");
        el.className = `card ${rankClass}`;
        el.innerHTML = `
          <div class="c-rank">
            <div class="rank-bg"></div>
            <div class="rank-val">${actualRank}.</div>
          </div>
          <div class="c-info">
            <img src="https://vzge.me/bust/${p.name}" class="skin-bust" 
                 onerror="this.onerror=null; this.src='${FALLBACK_SKIN}';" 
                 loading="lazy">
            <div class="meta">
              <div class="p-name">${p.name}</div>
              <div class="p-title">
                 <span class="diamond">❖</span> ${p.title} 
                 <span style="color:#555; margin-left:5px;">(${p.total})</span>
              </div>
            </div>
          </div>
          <div class="c-region">
            <div class="badge-reg ${regClass}">${p.region}</div>
          </div>
          <div class="c-tiers">
            ${tiersHtml}
          </div>
        `;
        el.onclick = () => openPlayerModal(p);
        listContainer.appendChild(el);
      });
    }

    function openPlayerModal(p) {
      const img = document.getElementById('mHead');
      img.src = `https://vzge.me/bust/${p.name}`;
      img.onerror = function() { this.src = FALLBACK_SKIN; };
      
      document.getElementById('mName').textContent = p.name;
      const testerBadge = document.getElementById('mTester');
      if(p.tester) testerBadge.classList.remove('hidden'); else testerBadge.classList.add('hidden');

      const rank = processedList.indexOf(p) + 1;
      document.getElementById('mRankNum').textContent = rank + ".";
      document.getElementById('mPoints').textContent = `(${p.total} points)`;

      const grid = document.getElementById('mTiersGrid');
      grid.innerHTML = "";
      
      CATEGORIES.forEach(cat => {
        const t = p.tiers[cat];
        const lvlClass = getLevelClass(t);
        
        const div = document.createElement("div");
        div.className = `mt-item ${lvlClass}`;
        div.innerHTML = `
          <div class="mt-circle">
            <svg class="mt-svg"><use href="#icon-${cat}"></use></svg>
          </div>
          <div class="mt-badge">${t || ''}</div>
        `;
        grid.appendChild(div);
      });

      document.getElementById('playerModal').classList.add('show');
    }

    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      }
    });
    document.getElementById("searchInput").oninput = render;

    init();
  </script>
</body>
</html>
