<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INVIS X | Leaderboards</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* --- THEME --- */
      --bg-body: #0b0d12;
      --bg-nav: #13151b;
      --bg-card: #161921;
      --bg-card-hover: #1c2029;
      --bg-modal: #0f1116; /* Darker modal bg */
      
      --text-main: #ffffff;
      --text-sub: #9ca3af;

      /* RANK COLORS (For main list) */
      --rank-1: #fbbf24; 
      --rank-2: #9ca3af; 
      --rank-3: #b45309; 
      --rank-n: #27272a; 

      /* BADGE COLORS (Matching Screenshot) */
      /* Level 1 (HT1/LT1) = Gold/Yellow */
      --c-1: #fbbf24; 
      /* Level 2 (HT2/LT2) = Blue/Grey */
      --c-2: #94a3b8; 
      /* Level 3 (HT3/LT3) = Orange/Brown */
      --c-3: #f97316; 
      /* Level 4/5 = Green/Generic */
      --c-4: #22c55e;
      
      --font-display: 'Poppins', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex; flex-direction: column;
      overflow-x: hidden;
    }

    /* --- NAVBAR --- */
    .navbar {
      background: var(--bg-nav);
      border-bottom: 1px solid #1f222b;
      height: 72px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; position: sticky; top: 0; z-index: 100;
    }

    .nav-tabs { display: flex; height: 100%; gap: 4px; overflow-x: auto; }
    
    .nav-tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 0 16px; min-width: 80px;
      color: #6b7280; font-weight: 600; font-size: 0.8rem;
      border-bottom: 3px solid transparent; transition: 0.2s; cursor: pointer; background: transparent; border: none;
    }
    .nav-tab img { width: 22px; height: 22px; filter: grayscale(100%) opacity(0.5); margin-bottom: 4px; transition: 0.2s; }
    
    .nav-tab:hover, .nav-tab.active { color: #fff; }
    .nav-tab:hover img, .nav-tab.active img { filter: grayscale(0) opacity(1); }
    .nav-tab.active { border-bottom-color: #fff; }

    /* --- LAYOUT --- */
    .container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; width: 100%; }

    .controls { display: flex; justify-content: flex-end; margin-bottom: 20px; }
    .search-input {
      background: #13151b; border: 1px solid #252830; color: #fff;
      padding: 10px 15px; border-radius: 8px; width: 100%; max-width: 300px;
      outline: none; transition: 0.2s;
    }
    .search-input:focus { border-color: #555; background: #000; }

    /* --- TABLE HEADER --- */
    .thead {
      display: grid; 
      grid-template-columns: 80px 280px 100px 1fr; 
      padding: 0 10px 10px; 
      color: #4b5563; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase;
    }
    .th-center { text-align: center; }
    .th-right { text-align: right; padding-right: 20px; }

    /* --- PLAYER CARD (Main List) --- */
    .card {
      display: grid;
      grid-template-columns: 80px 280px 100px 1fr;
      background: var(--bg-card);
      border-radius: 8px;
      height: 84px;
      margin-bottom: 8px;
      position: relative;
      transition: transform 0.2s, background 0.2s;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-2px); background: var(--bg-card-hover); z-index: 10; }

    .c-rank { position: relative; height: 100%; width: 100%; }
    .rank-bg {
      position: absolute; top: 0; left: 0; bottom: 0; width: 120%;
      background: var(--rank-n);
      clip-path: polygon(0 0, 75% 0, 100% 100%, 0% 100%);
      z-index: 1; border-radius: 8px 0 0 8px;
    }
    .rank-val {
      position: relative; z-index: 2; height: 100%; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; font-style: italic;
      padding-right: 20px; color: #fff;
    }
    .r1 .rank-bg { background: var(--rank-1); } .r1 .rank-val { color: #000; text-shadow: 0 1px 0 rgba(255,255,255,0.4); }
    .r2 .rank-bg { background: var(--rank-2); } .r2 .rank-val { color: #000; }
    .r3 .rank-bg { background: var(--rank-3); } .r3 .rank-val { color: #000; }

    .c-info { position: relative; z-index: 5; display: flex; align-items: center; margin-left: -15px; }
    .skin-bust { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.6)); margin-right: 12px; }
    .meta { display: flex; flex-direction: column; justify-content: center; }
    .p-name { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: #fff; }
    .p-title { font-size: 0.75rem; color: #9ca3af; display: flex; align-items: center; gap: 5px; }
    .diamond { color: #fbbf24; font-size: 0.7rem; }

    .c-region { display: flex; align-items: center; justify-content: center; z-index: 2; }
    .badge-reg { font-weight: 800; font-size: 0.9rem; padding: 4px 8px; border-radius: 4px; background: #333; color: #888; }
    .reg-NA { background: #7f1d1d; color: #fca5a5; }
    .reg-EU { background: #14532d; color: #86efac; }
    .reg-ASIA { background: #1e3a8a; color: #93c5fd; }

    .c-tiers { display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; gap: 14px; z-index: 2; }
    .t-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .t-icon { width: 18px; height: 18px; opacity: 0.4; filter: grayscale(1); }
    .t-icon.active { opacity: 1; filter: grayscale(0); }
    .t-badge { font-size: 0.6rem; font-weight: 800; padding: 1px 6px; border-radius: 4px; background: #27272a; color: #555; min-width: 30px; text-align: center; }
    .tb-active { color: #fff; }

    /* --- NEW MODAL STYLES (MATCHING SCREENSHOT) --- */
    .modal-wrap {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200;
      display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
    }
    .modal-wrap.show { display: flex; }
    
    .modal-box {
      background: var(--bg-modal); 
      padding: 30px; 
      border-radius: 12px; 
      border: 1px solid #1f222b;
      width: 100%; max-width: 500px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    .m-close-btn { position: absolute; top: 12px; right: 12px; color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
    .m-close-btn:hover { color: #fff; }

    .m-header {
      display: flex; flex-direction: column; align-items: center; margin-bottom: 24px;
    }
    .m-skin {
      width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }
    .m-name {
      font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: #fff;
    }
    .m-tester {
      font-size: 0.7rem; font-weight: 700; background: #7f1d1d; color: #fca5a5; 
      padding: 2px 8px; border-radius: 4px; margin-top: 4px; letter-spacing: 1px;
    }

    /* SECTION 1: POSITION */
    .m-section-label {
      font-size: 0.85rem; color: #6b7280; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;
    }
    
    .m-rank-card {
      background: #13151c; /* Darker box */
      border: 1px solid #222;
      border-radius: 8px;
      padding: 12px 20px;
      display: flex; align-items: center;
      margin-bottom: 24px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
    }
    
    .m-rank-num {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      font-style: italic;
      color: #fff;
      margin-right: 12px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    
    .m-trophy { width: 20px; height: 20px; margin-right: 8px; }
    
    .m-rank-text {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      margin-right: 8px;
    }
    
    .m-rank-pts {
      font-size: 1rem;
      color: #6b7280;
      font-weight: 500;
    }

    /* SECTION 2: TIERS */
    .m-tiers-card {
      background: #13151c;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .m-tier-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    
    .m-tier-circle {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #0b0d12;
      display: grid; place-items: center;
      border: 2px solid #333;
    }
    .m-tier-icon { width: 18px; height: 18px; opacity: 0.8; }
    
    .m-tier-text {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 800;
    }

    /* Coloring Logic based on screenshot */
    /* Level 1 (Gold) */
    .lvl-1 .m-tier-circle { border-color: rgba(251, 191, 36, 0.3); }
    .lvl-1 .m-tier-text { color: var(--c-1); }
    
    /* Level 2 (Blue/Grey) */
    .lvl-2 .m-tier-circle { border-color: rgba(148, 163, 184, 0.3); }
    .lvl-2 .m-tier-text { color: var(--c-2); }

    /* Level 3 (Orange/Brown) */
    .lvl-3 .m-tier-circle { border-color: rgba(249, 115, 22, 0.3); }
    .lvl-3 .m-tier-text { color: var(--c-3); }
    
    /* Empty/None */
    .lvl-n .m-tier-circle { border-color: #222; opacity: 0.5; }
    .lvl-n .m-tier-icon { opacity: 0.2; filter: grayscale(1); }
    .lvl-n .m-tier-text { display: none; }


    /* Responsive */
    @media (max-width: 1024px) {
      .thead, .c-region, .c-tiers { display: none; }
      .card { grid-template-columns: 60px 1fr; height: auto; padding-right: 15px; }
      .rank-bg { width: 100%; clip-path: none; border-radius: 8px 0 0 8px; }
      .rank-val { padding-right: 0; font-size: 1.4rem; }
      .c-info { margin-left: 10px; padding: 10px 0; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-tabs" id="navTabs">
      <button class="nav-tab active" data-filter="overall">
        <img src="https://cdn-icons-png.flaticon.com/512/10697/10697368.png" alt="Overall">
        <span>Overall</span>
      </button>
      <button class="nav-tab" data-filter="sword">
        <img src="https://cdn-icons-png.flaticon.com/512/9637/9637213.png" alt="Sword">
        <span>Sword</span>
      </button>
      <button class="nav-tab" data-filter="axe">
        <img src="https://cdn-icons-png.flaticon.com/512/8144/8144456.png" alt="Axe">
        <span>Axe</span>
      </button>
      <button class="nav-tab" data-filter="crystal">
        <img src="https://cdn-icons-png.flaticon.com/512/2622/2622557.png" alt="Crystal">
        <span>Crystal</span>
      </button>
      <button class="nav-tab" data-filter="nethpot">
        <img src="https://cdn-icons-png.flaticon.com/512/867/867909.png" alt="Pot">
        <span>Pot</span>
      </button>
      <button class="nav-tab" data-filter="uhc">
        <img src="https://cdn-icons-png.flaticon.com/512/833/833475.png" alt="UHC">
        <span>UHC</span>
      </button>
      <button class="nav-tab" data-filter="smp">
        <img src="https://cdn-icons-png.flaticon.com/512/3033/3033143.png" alt="SMP">
        <span>SMP</span>
      </button>
      <button class="nav-tab" data-filter="mace">
        <img src="https://cdn-icons-png.flaticon.com/512/9349/9349884.png" alt="Mace">
        <span>Mace</span>
      </button>
    </div>
  </nav>

  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search player..." spellcheck="false">
    </div>

    <div class="thead">
      <div class="th-center">#</div>
      <div>PLAYER</div>
      <div class="th-center">REGION</div>
      <div class="th-right">TIERS</div>
    </div>

    <div id="listContainer">
      <!-- JS injects rows here -->
    </div>
  </div>

  <!-- MODAL (Redesigned) -->
  <div id="playerModal" class="modal-wrap">
    <div class="modal-box">
      <button class="m-close-btn" onclick="document.getElementById('playerModal').classList.remove('show')">&times;</button>
      
      <!-- Header: Skin & Name -->
      <div class="m-header">
        <img id="mHead" src="" class="m-skin">
        <div id="mName" class="m-name">Player</div>
        <div id="mTester" class="m-tester hidden">TESTER</div>
      </div>

      <!-- SECTION: POSITION -->
      <div class="m-section-label">POSITION</div>
      <div class="m-rank-card">
        <div id="mRankNum" class="m-rank-num">1.</div>
        <img src="https://cdn-icons-png.flaticon.com/512/5906/5906109.png" class="m-trophy" alt="🏆">
        <div class="m-rank-text">OVERALL</div>
        <div id="mPoints" class="m-rank-pts">(0 points)</div>
      </div>

      <!-- SECTION: TIERS -->
      <div class="m-section-label">TIERS</div>
      <div id="mTiersGrid" class="m-tiers-card">
        <!-- Icons injected via JS -->
      </div>

    </div>
  </div>

  <script>
    // --- Config ---
    const CATEGORIES = ["sword","axe","crystal","nethpot","uhc","smp","mace"];
    const ICONS = {
      sword: "https://cdn-icons-png.flaticon.com/512/9637/9637213.png",
      axe: "https://cdn-icons-png.flaticon.com/512/8144/8144456.png",
      crystal: "https://cdn-icons-png.flaticon.com/512/2622/2622557.png",
      nethpot: "https://cdn-icons-png.flaticon.com/512/867/867909.png",
      uhc: "https://cdn-icons-png.flaticon.com/512/833/833475.png",
      smp: "https://cdn-icons-png.flaticon.com/512/3033/3033143.png",
      mace: "https://cdn-icons-png.flaticon.com/512/9349/9349884.png"
    };
    const FALLBACK_SKIN = "https://vzge.me/bust/X-Steve";

    const POINTS = { "HT1": 60, "LT1": 30, "HT2": 30, "LT2": 15, "HT3": 15, "LT3": 14, "HT4": 8, "LT4": 6, "HT5": 4, "LT5": 1 };

    let players = [];
    let processedList = [];
    let currentFilter = "overall";

    function getPoints(t) { return POINTS[t] || 0; }
    
    function getTitle(pts) {
      if(pts >= 400) return "Combat Grandmaster";
      if(pts >= 250) return "Combat Master";
      if(pts >= 100) return "Combat Ace";
      return "Novice";
    }

    // Helper for main list badges
    function getBadgeClass(tier) {
      if(!tier) return "";
      return "tb-active"; 
    }

    // Helper for Modal Colors (Matches screenshot style)
    function getLevelClass(tier) {
      if(!tier) return "lvl-n";
      if(tier.includes('1')) return "lvl-1"; // Gold
      if(tier.includes('2')) return "lvl-2"; // Blue/Grey
      if(tier.includes('3')) return "lvl-3"; // Orange/Brown
      return "lvl-1"; // Default
    }

    async function init() {
      // 1. Load
      try {
        const req = await fetch('./players.json');
        if(req.ok) {
           const json = await req.json();
           if(Array.isArray(json)) players = json;
           else if(json.players) players = json.players;
           else {
             for(let [k,v] of Object.entries(json)) {
               if(typeof v !== 'object') continue;
               CATEGORIES.forEach(c => {
                 if(v[c]) players.push({ name: k, cat: c, tier: v[c], region: v.region, tester: v.tester });
               });
             }
           }
        }
      } catch(e) {}

      // 2. Fallback Data
      if(!players.length) {
        players = [
          {name:"Marlowww", cat:"uhc", tier:"HT1", region:"NA"},
          {name:"Marlowww", cat:"sword", tier:"LT1", region:"NA"},
          {name:"Marlowww", cat:"axe", tier:"LT1", region:"NA"},
          {name:"Marlowww", cat:"crystal", tier:"HT1", region:"NA"},
          {name:"Marlowww", cat:"nethpot", tier:"HT1", region:"NA"},
          {name:"ItzRealMe", cat:"sword", tier:"HT3", region:"NA"},
          {name:"ItzRealMe", cat:"crystal", tier:"HT1", region:"NA"},
          {name:"ItzRealMe", cat:"nethpot", tier:"HT1", region:"NA"},
          {name:"coldified", cat:"uhc", tier:"LT1", region:"EU"},
          {name:"coldified", cat:"axe", tier:"LT1", region:"EU"},
          {name:"coldified", cat:"sword", tier:"HT2", region:"EU"}
        ];
      }

      // 3. Group & Sort
      const map = new Map();
      players.forEach(p => {
        if(!CATEGORIES.includes(p.cat)) return;
        if(!map.has(p.name)) {
          map.set(p.name, { name: p.name, region: p.region||"NA", tester: !!p.tester, tiers: {}, total: 0 });
        }
        const entry = map.get(p.name);
        const cur = entry.tiers[p.cat];
        if(!cur || getPoints(p.tier) > getPoints(cur)) {
          entry.tiers[p.cat] = p.tier;
        }
      });

      for(let p of map.values()) {
        let t = 0;
        Object.values(p.tiers).forEach(tier => t += getPoints(tier));
        p.total = t;
        p.title = getTitle(t);
      }

      processedList = Array.from(map.values()).sort((a,b) => b.total - a.total);
      
      render();
    }

    function render() {
      const listContainer = document.getElementById("listContainer");
      const filterTerm = document.getElementById("searchInput").value.toLowerCase();
      listContainer.innerHTML = "";

      let displayData = processedList;
      if(currentFilter !== "overall") {
        displayData = processedList.filter(p => p.tiers[currentFilter]);
      }
      displayData = displayData.filter(p => p.name.toLowerCase().includes(filterTerm));

      if(!displayData.length) {
        listContainer.innerHTML = `<div style="text-align:center; padding:40px; color:#555;">No players found</div>`;
        return;
      }

      displayData.forEach((p, index) => {
        // Find actual rank in overall list
        const actualRank = processedList.indexOf(p) + 1;
        
        let rankClass = "rn";
        if(actualRank === 1) rankClass = "r1";
        if(actualRank === 2) rankClass = "r2";
        if(actualRank === 3) rankClass = "r3";

        const regClass = `reg-${p.region}`;

        // Build main list tiers (Simple view)
        const tiersHtml = CATEGORIES.map(cat => {
          const t = p.tiers[cat];
          const hasTier = !!t;
          return `
            <div class="t-col">
              <img src="${ICONS[cat]}" class="t-icon ${hasTier?'active':''}">
              <div class="t-badge ${hasTier?'tb-active':''}">${t || '-'}</div>
            </div>
          `;
        }).join('');

        const el = document.createElement("div");
        el.className = `card ${rankClass}`;
        el.innerHTML = `
          <div class="c-rank">
            <div class="rank-bg"></div>
            <div class="rank-val">${actualRank}.</div>
          </div>
          <div class="c-info">
            <img src="https://vzge.me/bust/${p.name}" class="skin-bust" 
                 onerror="this.onerror=null; this.src='${FALLBACK_SKIN}';" 
                 loading="lazy">
            <div class="meta">
              <div class="p-name">${p.name}</div>
              <div class="p-title">
                 <span class="diamond">❖</span> ${p.title} 
                 <span style="color:#555; margin-left:5px;">(${p.total})</span>
              </div>
            </div>
          </div>
          <div class="c-region">
            <div class="badge-reg ${regClass}">${p.region}</div>
          </div>
          <div class="c-tiers">
            ${tiersHtml}
          </div>
        `;
        el.onclick = () => openPlayerModal(p);
        listContainer.appendChild(el);
      });
    }

    function openPlayerModal(p) {
      const img = document.getElementById('mHead');
      img.src = `https://vzge.me/bust/${p.name}`;
      img.onerror = function() { this.src = FALLBACK_SKIN; };
      
      document.getElementById('mName').textContent = p.name;
      
      const testerBadge = document.getElementById('mTester');
      if(p.tester) testerBadge.classList.remove('hidden');
      else testerBadge.classList.add('hidden');

      // Rank Section
      const rank = processedList.indexOf(p) + 1;
      document.getElementById('mRankNum').textContent = rank + ".";
      document.getElementById('mPoints').textContent = `(${p.total} points)`;

      // Tiers Grid
      const grid = document.getElementById('mTiersGrid');
      grid.innerHTML = "";
      
      CATEGORIES.forEach(cat => {
        const t = p.tiers[cat];
        const lvlClass = getLevelClass(t);
        
        const div = document.createElement("div");
        div.className = `m-tier-item ${lvlClass}`;
        div.innerHTML = `
          <div class="m-tier-circle">
            <img src="${ICONS[cat]}" class="m-tier-icon">
          </div>
          <div class="m-tier-text">${t || ''}</div>
        `;
        grid.appendChild(div);
      });

      document.getElementById('playerModal').classList.add('show');
    }

    // Events
    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      }
    });

    document.getElementById("searchInput").oninput = render;

    init();

  </script>
</body>
</html>
