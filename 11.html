<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Avatar Search</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }

        h2 { margin-top: 0; }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #333;
            color: white;
            box-sizing: border-box; /* Ensures padding doesn't break width */
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 20px;
            min-height: 256px; /* Keeps layout stable */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error { color: #ff6b6b; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Avatar Search</h2>
        <input type="text" id="usernameInput" placeholder="Enter Minecraft Username" onkeypress="handleEnter(event)">
        <button onclick="searchAvatar()">Get Bust</button>
        
        <div id="result">
            <!-- Image will appear here -->
        </div>
    </div>

    <script>
        async function searchAvatar() {
            const input = document.getElementById('usernameInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (!input) {
                resultDiv.innerHTML = '<p class="error">Please enter a username.</p>';
                return;
            }

            resultDiv.innerHTML = '<p style="color:#aaa;">Loading...</p>';

            try {
                // Step 1: We need to turn the Username into a UUID.
                // We use playerdb.co API (free, no CORS issues) to get the UUID.
                const response = await fetch(`https://playerdb.co/api/player/minecraft/${input}`);
                const data = await response.json();

                if (data.success) {
                    const uuid = data.data.player.id;
                    const playerName = data.data.player.username;

                    // Step 2: Use the Visage URL with the UUID
                    const visageUrl = `https://visage.surgeplay.com/bust/256/${uuid}`;

                    // Display the image
                    resultDiv.innerHTML = `
                        <div>
                            <img src="${visageUrl}" alt="${playerName}'s Avatar">
                            <p style="margin-top:10px; font-size: 0.9em; color: #ccc;">${playerName}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = '<p class="error">Player not found.</p>';
                }
            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = '<p class="error">Error fetching data.</p>';
            }
        }

        // Allow pressing "Enter" key to search
        function handleEnter(e) {
            if (e.key === 'Enter') {
                searchAvatar();
            }
        }
    </script>

</body>
</html>
